# ios/project.yml
name: PetHomepage
options:
  bundleIdPrefix: pet.homepage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PetHomepage:
    type: application
    platform: iOS
    sources:
      - path: PetHomepage
        excludes:
          - "**/.omc/**"
      # Shared with the widget extension: the ActivityAttributes both sides encode/decode.
      - path: PetHomepageWidgets/WalkActivityAttributes.swift
    dependencies:
      - target: PetHomepageWidgets
        embed: true
    entitlements:
      path: PetHomepage/PetHomepage.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.pet.homepage
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.pet.homepage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pet.homepage.PetHomepage
        DEVELOPMENT_TEAM: X5C7XC8SAV
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App uses only standard HTTPS/TLS (export-exempt) — declare it so TestFlight
        # doesn't ask the export-compliance question on every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Orientations (required for App Store validation). Phone is portrait-only;
        # iPad declares all four so it isn't rejected for multitasking.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Without a launch screen, iOS renders the app letterboxed (black bars,
        # scaled into a smaller box). This synthesizes an empty UILaunchScreen so
        # the app draws full-screen at native resolution on every device.
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Required for the "Pair a device" QR scanner (VisionKit DataScannerViewController).
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to attach to your pet's records and scan the pairing QR code shown on your dashboard."
        # Walk auto-detection (Settings → Walk detection). When-In-Use covers the home-location
        # picker; Always powers the home geofence that starts/ends walk logging in background.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Detect when a walk starts so the app can offer to log it."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "End the walk automatically the moment you arrive back home, even when the app is closed."
        INFOPLIST_KEY_NSMotionUsageDescription: "Recognize walking so short trips to the car don't trigger walk prompts."
        # Lock-screen walk timer (WalkLiveActivityWidget in the PetHomepageWidgets extension).
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
  PetHomepageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PetHomepageWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pet.homepage.PetHomepage.Widgets
        DEVELOPMENT_TEAM: X5C7XC8SAV
        CODE_SIGN_STYLE: Automatic
        # XcodeGen writes this target's Info.plist from the `info` block below; the
        # project-wide GENERATE_INFOPLIST_FILE=YES must not also synthesize one.
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: PetHomepageWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Pet Homepage"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PetHomepageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetHomepageTests
        excludes:
          - "**/.omc/**"
    dependencies:
      - target: PetHomepage
  PetHomepageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PetHomepageUITests
        excludes:
          - "**/.omc/**"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PetHomepage
schemes:
  PetHomepage:
    build:
      targets:
        PetHomepage: all
    test:
      targets:
        - PetHomepageTests
        - PetHomepageUITests
