# ios/project.yml
name: PetHomepage
options:
  bundleIdPrefix: pet.homepage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PetHomepage:
    type: application
    platform: iOS
    sources:
      - path: PetHomepage
        excludes:
          - "**/.omc/**"
    entitlements:
      path: PetHomepage/PetHomepage.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.pet.homepage
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.pet.homepage
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pet.homepage.PetHomepage
        DEVELOPMENT_TEAM: X5C7XC8SAV
        CODE_SIGN_STYLE: Automatic
        # Without a launch screen, iOS renders the app letterboxed (black bars,
        # scaled into a smaller box). This synthesizes an empty UILaunchScreen so
        # the app draws full-screen at native resolution on every device.
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  PetHomepageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetHomepageTests
        excludes:
          - "**/.omc/**"
    dependencies:
      - target: PetHomepage
schemes:
  PetHomepage:
    build:
      targets:
        PetHomepage: all
    test:
      targets:
        - PetHomepageTests
