# ios/project.yml
name: PetHomepage
options:
  bundleIdPrefix: pet.homepage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PetHomepage:
    type: application
    platform: iOS
    sources:
      - path: PetHomepage
    entitlements:
      path: PetHomepage/PetHomepage.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.pet.homepage
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.pet.homepage
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pet.homepage.PetHomepage
        CODE_SIGNING_ALLOWED: NO
  PetHomepageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetHomepageTests
    dependencies:
      - target: PetHomepage
schemes:
  PetHomepage:
    build:
      targets:
        PetHomepage: all
    test:
      targets:
        - PetHomepageTests
