s)\n\nGoal: validate the core thesis (people will forward emails, vet prep delivers value)\n\n- [ ] Create pet profile\n- [ ] Email ingestion pipeline + Claude parser\n- [ ] Pet page rendering (timeline, photos, records)\n- [ ] Monthly digest email\n- [ ] Vet visit summary generator\n- [ ] Magic-link auth\n- [ ] Shareable public view\n- [ ] Ship to Sandi + 5 friends' pets\n\nSee [[08-mvp-scope]] for details.\n\n**Exit criteria:** at least 3 of 5 users are actively forwarding emails after 2 weeks; at least 1 user has used the vet prep feature.\n\n## Phase 2 — v0.5 (months 2-3)\n\nGoal: add the features that drive retention and prove the monetization model\n\n- [ ] SMS inbound and outbound (Twilio + 10DLC registration)\n- [ ] SMS reminders for preventatives and vaccinations\n- [ ] Multi-pet support\n- [ ] Memory features (year-in-review, \"a year ago today\")\n- [ ] Basic billing (Stripe, annual only at first)\n- [ ] Landing page with waitlist\n- [ ] First paying customers\n\n**Exit criteria:** ~50 paying users, retention at 30 days above 40%, monthly digest open rate above 50%\n\n## Phase 3 — Public launch (months 3-6)\n\nGoal: prove distribution can work\n\n- [ ] Product Hunt launch\n- [ ] 3-5 foundational SEO blog posts\n- [ ] Subreddit engagement program\n- [ ] Small pet influencer outreach\n- [ ] First 500 paying users (lifetime deal caps out here)\n\n**Exit criteria:** 500+ paying users, at least one working acquisition channel with positive ROI\n\n## Phase 4 — Consolidation (months 6-12)\n\nGoal: polish, retain, and scale distribution\n\n- [ ] Expand feature set based on user feedback (multi-user collab, shareable sitter mode, emergency QR code, expense tracking)\n- [ ] FitBark API integration as first wearable proof of concept\n- [ ] Apple Photos / Google Photos integration for passive photo ingestion\n- [ ] SEO content cadence established\n- [ ] Email drip campaigns for dormant users\n- [ ] First local vet clinic referral pilot\n\n**Exit criteria:** 2,000+ paying users, demonstrable retention over 6 months, clear understanding of which channels work\n\n## Phase 5 — Expansion (year 2)\n\nGoal: broaden the product footprint and explore partnerships\n\n- [ ] Vet referral program formalized\n- [ ] Specialty hospital partnerships pilot\n- [ ] Tractive / Fi API conversations\n- [ ] Pet insurance API integrations\n- [ ] Possibly: start of second template (events? plant care?)\n- [ ] Possibly: QR pet tag as a physical product\n\n**Exit criteria:** ~5,000+ paying users, a working sales motion for vet partnerships, clear signal on whether the platform expansion is real or a distraction\n\n## Phase 6 — Platform or hardware (year 2.5-3)\n\nThis is where the fork happens. Two credible paths:\n\n### Path A: platform expansion\n\n- Launch second and third template verticals (events, collections, profiles)\n- Unify under a broader \"pages for your life\" brand\n- Leverage appgardn as the hosting layer\n- Consider a plurality of products under one namespace\n\n### Path B: pet hardware\n\n- Begin hardware product in earnest\n- Partner with a contract manufacturer\n- Pre-order campaign to existing user base\n- Ship a custom collar or pet tag with proprietary sensors\n\nThe choice depends on what the product has taught us and where user demand is strongest. Neither path is committed in advance.\n\n## Cross-cutting themes\n\nThese run across all phases:\n\n- **Design quality** — every phase should maintain the Greece-trip bar. Ugly is an existential risk given the competition.\n- **Honest validation** — every phase has exit criteria. Don't advance just because time has passed; advance because the signal is there.\n- **Distribution discipline** — budget mental and calendar time for distribution work, not just product work.\n- **Competitive awareness** — monitor Fi, Tractive, VetDex, and the PetDesk ecosystem. Update strategy as they ship new features.\n- **Cost discipline** — especially on SMS and AI usage, to preserve unit economics.\n\n## Related\n\n- [[00-overview]]\n- [[04-features]]\n- [[08-mvp-scope]]\n- [[09-distribution-and-launch]]\n- [[10-hardware-vision]]\n- [[11-vet-partnerships]]\n- [[12-risks-and-open-questions]]"},"2026-06-19-pet-homepage-ios-health-app-design":{"id":"2026-06-19-pet-homepage-ios-health-app-design","col":"specs","title":"pet-homepage v2 — iOS Health App — Design","meta":{},"body":"# pet-homepage v2 — iOS Health App — Design\n\n**Date:** 2026-06-19\n**Status:** Approved design, pre-implementation\n**Supersedes:** the web-first, email-ingestion direction in `docs/03-pet-product-spec.md` / `docs/04-features.md`\n\n---\n\n## 1. Summary\n\n`pet-homepage` pivots from a **web-first, passive ingestion** product (owner forwards\nemail/SMS → AI extracts → web page) to an **iOS-native, active-logging** app where a\npet owner opens the app and taps to log medications, vaccinations, vet visits, weight,\nhealth markers, and symptoms — with **notifications** as the core habit driver.\n\nAI extraction does not go away; it moves from being *the* interface to being one\nconvenient input among many (upload a vet PDF / photo of a record → Claude pulls out\nstructured fields).\n\nv1 ships the **full health record**. The photo diary is deferred to v2.\n\n### Primary user\nA single pet owner tracking the health of **one pet** (single-pet in v1; the model can\ngrow to multi-pet later).\n\n---\n\n## 2. Architecture\n\n| Concern | Choice |\n| --- | --- |\n| App | **iOS native, SwiftUI** (no Android in this direction — the CloudKit trade) |\n| Local store / sync | **Core Data + CloudKit** (`NSPersistentCloudKitContainer`) — offline-first, auto-syncs to the user's **private** iCloud DB |\n| Raw documents | **iCloud Drive** container — originals (vet PDFs, record photos) stored as real files, visible in Finder / iCloud.com, shareable via links |\n| AI extraction | **Stateless Next.js `/api/extract` endpoint** running Claude (`generateObject` + existing discriminated-union Zod schema). App sends a file, gets structured fields back, writes them into Core Data. Server never touches iCloud. |\n| Desktop / web | **Opt-in app→Convex mirror → Next.js read-only dashboard** (Mac + Windows) + cloud backup |\n| Notifications | **On-device local notifications** (fire offline, no server cron) |\n\n### Why CloudKit\nOffline-first for free (local store is source of truth, Apple syncs it), zero backend\ncost, maximally private (data in the user's own iCloud), no auth to build (Apple ID),\nmulti-device included.\n\n### The core tension (acknowledged)\nYou cannot simultaneously have *no backend*, *data only in private iCloud*, and a\n*smooth Windows web dashboard*. Resolution: the **app** is private/offline-first on\nCloudKit; the **web dashboard** is served by an **opt-in mirror** to a small backend\n(a copy of data leaves iCloud, mitigated by opt-in / minimal fields / optional\nclient encryption). Raw documents reach the web via iCloud Drive links with no mirror.\n\n### What is retired vs reused\n- **Retired:** Convex as the *app's* primary data store (CloudKit replaces it). The\n  Cloudflare email-ingest worker and the email/SMS passive-ingestion flow are **not**\n  in v1 scope.\n- **Reused:** the AI extraction lib (`lib/ingestion/extract.ts`) and the Zod record\n  schemas (`lib/schemas/extraction.ts`) — they back `/api/extract` and serve as the\n  blueprint for the Core Data model. Convex returns in a smaller role as the **mirror\n  sink + dashboard source**.\n\n---\n\n## 3. Project structure (one repo)\n\n```\npet-homepage/\n  ios/      ← NEW Xcode SwiftUI project (the app)\n  web/      ← slimmed Next.js: /api/extract + CloudKit-mirror dashboard (Convex-backed)\n  shared/   ← record schema as single source of truth (Zod, mirrored into Swift models)\n  docs/     ← existing Obsidian vault (this spec lives in docs/superpowers/specs/)\n```\n\n`shared/` is the canonical record definition. Swift models are mirrored from it; keep\nthem in sync deliberately (see Risks).\n\n---\n\n## 4. Data model (Core Data entities)\n\nMapped from the existing Convex schema (`convex/schema.ts`) plus new entities for\ndose logging, symptoms, generic markers, recommendations, and attachments.\n\n- **Pet** (single in v1): name, species, breed, dob, adoptionDate, photo\n- **Medication**: drugName, dosage, frequency, schedule (drives reminders), startedAt,\n  endedAt, refillDueAt\n- **DoseLog** *(new)*: medicationID, givenAt — powers \"when did I last give the\n  preventative\"\n- **Vaccination**: vaccineName, administeredAt, nextDueAt, lotNumber, administeredBy\n- **VetVisit**: occurredAt, clinic, vetName, reason, diagnosis, treatmentNotes,\n  nextVisitDate; links to attachments\n- **VetRecommendation** *(new)*: vetVisitID?, date, text — \"logging recommendations\n  from vets\"\n- **HealthMarker** *(new, generic; absorbs weight)*: type (weight, appetite, energy,\n  water, …), value, unit, recordedAt\n- **SymptomEpisode** *(new)*: category (digestive, skin, behavior, diet, energy,\n  other), startedAt, resolvedAt?, status — the container for \"start tracking a\n  digestive issue\"\n- **SymptomEntry** *(new)*: episodeID, date, severity (mild/moderate/severe), note,\n  suspectedCause — daily logs under an episode\n- **Attachment**: fileName, type, iCloud Drive path, linked record — the originals\n\n---\n\n## 5. v1 feature modules & screens\n\n1. **Pet profile** — create/edit the single pet\n2. **Medications** — list, tap-to-log a dose, \"last given,\" refill tracking, reminder\n   schedule\n3. **Vaccinations** — records, \"last / next,\" due reminders\n4. **Vet visits** — log a visit; **upload a record → AI extract** fields; **log vet\n   recommendations**\n5. **Weight & health markers** — log values, view trend\n6. **Symptoms** — start an episode → add daily entries with severity + suspected cause\n\nDeferred to **v2:** photo diary (upload, browse over time, albums/backgrounds/year\nexports).\n\n---\n\n## 6. Notifications\n\nOn-device **local notifications**, scheduled by the app, so they fire offline with no\nserver dependency:\n\n- **Medications** — \"give the meds at 6pm\" per the med's schedule\n- **Vaccinations** — due/overdue based on `nextDueAt`\n- **Vet visits** — a **configurable cadence** (\"see vet every N months\"), set up front\n\n---\n\n## 7. Desktop / web layer (phase 5)\n\n- **Documents:** originals live in iCloud Drive → shareable links, viewable in Finder\n  and on iCloud.com on **Mac and Windows**, no app needed. Covers \"grab the bloodwork\n  on my laptop.\"\n- **Dashboard:** when online (and **opt-in**), the iOS app mirrors records to **Convex**;\n  a **Next.js read-only dashboard** reads Convex and renders the pet's health record on\n  any browser. Doubles as **cloud backup**.\n- **Privacy mitigation:** mirror is opt-in; consider mirroring minimal/non-sensitive\n  fields and/or client-side encryption of sensitive notes.\n\n---\n\n## 8. Build sequence (phased within v1 — each phase shippable)\n\n1. **Foundation** — Xcode SwiftUI project, Core Data + CloudKit, Pet profile, iCloud\n   Drive plumbing\n2. **Meds + notifications** — the core habit loop (log doses, \"last given,\" reminders)\n3. **Vaccinations + vet visits** (incl. recommendations) + **AI record-upload endpoint**\n   (`/api/extract`)\n4. **Weight/markers + symptom tracking**\n5. **Desktop** — iCloud Drive document links + app→Convex mirror + Next.js dashboard\n\nOptional leaner first release: ship phases 1–3, fold 4–5 into a fast-follow.\n\n---\n\n## 9. Risks / open questions\n\n- **CloudKit JS avoided**, but the **opt-in mirror** means a copy of health data leaves\n  iCloud — confirm the privacy posture (opt-in default, field scope, encryption).\n- **No Android** in this direction.\n- **Schema duplication** (Zod ↔ Swift Core Data) — `shared/` is canonical; needs a\n  deliberate sync discipline (and ideally a check).\n- **CloudKit schema migrations** are constrained (additive-friendly, deletes are\n  painful) — design entities with growth in mind.\n- **Apple Developer Program** membership required for CloudKit + device builds.\n- **Single-pet → multi-pet** later will touch navigation and every screen's \"which\n  pet\" context — keep that seam clean even while v1 is single-pet."},"2026-06-29-care-activities-design":{"id":"2026-06-29-care-activities-design","col":"specs","title":"Activities (logged care events) + Camera Capture — Design","meta":{},"body":"# Activities (logged care events) + Camera Capture — Design\n\n**Date:** 2026-06-29\n**Status:** Approved (brainstorm), pending implementation plan\n**Scope:** iOS app (`ios/PetHomepage`). The iOS app is the system of record (Core Data + CloudKit); Convex is only the read-only desktop mirror and is **out of scope** for this round.\n\n## Problem\n\nThe app can log medical records (vaccines, vet visits, meds, health markers, symptoms), but there is no way to log **recurring care activities** — bath, nail trim, grooming, teeth brushing, flea/tick, deworming, etc. These are point-in-time events that:\n\n- happen repeatedly and should be tracked as a history,\n- have a sane recurring cadence (\"bathe every ~4 weeks\"),\n- should surface in Home's **\"Due soon\"** and fire a reminder, like vaccines and vet visits already do.\n\nSeparately: photo attachment today is **library-only** (`PhotosPicker`). Users want to **take a photo with the camera** when logging.\n\n## Decisions\n\n1. **User-defined activity types, pre-seeded with sane defaults.** Not a hardcoded enum, and not a setup chore — a real `ActivityType` entity that ships pre-populated with editable starter types so logging works with zero setup.\n2. **Definition vs. occurrence are separate entities, named after the existing `Medication` → `DoseLog` convention:** `ActivityType` is the kind of thing; `ActivityLog` is each time it happened. This split is what makes pre-seeding, custom-before-first-log, rename, and archive possible.\n3. **Category is a fixed enum, not a third entity.** Each `ActivityType` belongs to an app-defined `ActivityCategory` (Care, Play, Feeding, Training, Health, Other). Unlike types, categories are a small stable set nobody needs to create/rename/archive — so it mirrors the existing `MarkerType` enum (stored as `categoryRaw`, `.other` fallback) rather than adding entity sprawl. It groups the type picker into sections and gives the Timeline a coarse filter.\n4. **Cadence lives per-type as a default, copied onto each occurrence.** Mirrors the existing `Vaccination` pattern (each occurrence carries its own `nextDueAt`), so cadence needs no separate schedule entity and no migration gymnastics.\n5. **Reuse the existing notification system** (`DueReminderScheduler` / `NotificationScheduling`) rather than inventing a new one.\n6. **Camera capture is a cross-cutting improvement** to the shared photo components, so every record type (and the new Activities) gets it at once.\n\n## Non-goals (this round)\n\n- Adding Activities to the Convex `MirrorSnapshot` / desktop dashboard.\n- Per-activity custom reminder times (uses the scheduler's default hour/minute, like vaccinations).\n- Multi-pet scoping beyond the existing single-pet (v1) model.\n\n---\n\n## Data model\n\nTwo new Core Data entities, plus one new relationship on `Photo`.\n\n### `ActivityType` (the definition — user-manageable)\n\n| field | type | purpose |\n|---|---|---|\n| `id` | UUID | identity |\n| `name` | String | \"Bath\", \"Nail trim\", custom names |\n| `categoryRaw` | String | `ActivityCategory` rawValue (`.other` fallback) |\n| `iconName` | String | SF Symbol name |\n| `defaultIntervalDays` | Int (0 = no cadence) | sane default repeat interval |\n| `sortOrder` | Int | ordering in pickers/lists |\n| `isArchived` | Bool | hide without deleting; preserves history |\n| `logs` | [ActivityLog] | inverse relationship |\n\n### `ActivityLog` (one occurrence)\n\n| field | type | purpose |\n|---|---|---|\n| `id` | UUID | identity |\n| `performedAt` | Date | when it happened |\n| `note` | String? | optional note |\n| `intervalDays` | Int (0 = no cadence) | copied from the type at log time; editable per occurrence |\n| `nextDueAt` | Date? | `performedAt + intervalDays` when interval > 0, else nil; stamped on save |\n| `activityType` | ActivityType? | the definition this log belongs to |\n| `pet` | Pet? | scoping (single-pet v1) |\n| `photos` | [Photo] | new inverse on `Photo` |\n\n### `ActivityCategory` (fixed enum, not an entity)\n\nMirrors `MarkerType`: a `String`-backed enum with `displayName`, an SF Symbol, and a `.other` fallback for unknown raw values.\n\n| case | displayName | iconName (provisional) |\n|---|---|---|\n| `care` | Care | `heart` |\n| `play` | Play | `tennisball` |\n| `feeding` | Feeding | `fork.knife` |\n| `training` | Training | `figure.walk` |\n| `health` | Health | `cross.case` |\n| `other` | Other | `pawprint` |\n\n### `Photo` — add one relationship\n\nAdd `activityLog: ActivityLog?` (optional, maxCount 1, Nullify) mirroring the existing per-parent relationships (`vetVisit`, `medication`, `vaccination`, `diaryEntry`, `pet`), plus the inverse `photos` on `ActivityLog`.\n\n---\n\n## Seeding (zero-setup defaults)\n\nOn first use, seed a starter set of editable `ActivityType` rows so the user can log immediately:\n\n| name | category | defaultIntervalDays | iconName |\n|---|---|---|---|\n| Bath | care | 30 | `shower` |\n| Nail trim | care | 21 | `scissors` |\n| Teeth brushing | care | 1 | `mouth` |\n| Brushing / coat | care | 7 | `comb` |\n| Flea & tick | health | 30 | `ladybug` |\n| Deworming | health | 90 | `pills` |\n| Grooming | care | 42 | `dog` |\n\n(SF Symbol names are provisional; verify each exists at build time and substitute a close match if not.)\n\nSeeded rows are **real, editable rows** — the user can rename them, change cadence, or archive ones they don't want.\n\n### CloudKit-safe seeding\n\nThe store syncs via CloudKit, so a naïve \"seed on first launch per device\" double-seeds when a second device syncs. Approach:\n\n- Seed **lazily** the first time the Activities screen is opened (not at app launch).\n- Guard the seed so it runs **once per iCloud account** (e.g. a flag that is itself a synced record, or a check that no non-archived default types already exist after the initial cloud import settles).\n- **De-dupe by name on load** as a backstop: if two same-named default types exist, collapse to one and re-point logs.\n\nThe exact guard mechanism is an implementation-plan detail; the requirement is: **default types appear exactly once per account, and never block first-use logging.**\n\n---\n\n## Store — `ActivityStore`\n\nManages both `ActivityType` and `ActivityLog` (they're tightly coupled — you can't log without a type). Mirrors `HealthMarkerStore` (same `context` + `petStore` constructor, single-pet scoping). Responsibilities:\n\n- **ActivityType CRUD:** list (non-archived, by category then `sortOrder`), create (name required; category defaults to `.other`, icon defaults to a generic paw e.g. `pawprint`, interval defaults to 0/no-repeat), update, archive. A type with logged occurrences cannot be hard-deleted — only archived.\n- **Log:** `log(type:performedAt:note:intervalDays:)` — copies `intervalDays` from the type unless overridden, stamps `nextDueAt`, sets `pet` via `petStore.ensurePet()`, saves.\n- **Queries:** `logs()` (all, newest first), `logs(of type:)`, `latestLog(of type:)`.\n- **Reminder sync is ViewModel-driven** (matching the codebase convention — stores never touch the scheduler). After the store saves a new log, the edit ViewModel schedules the new log's reminder and **cancels the prior latest-of-type reminder** (captured before logging) so a type never has two pending reminders. Timeline delete cancels the deleted log's reminder.\n- **Seeding:** `seedDefaultsIfNeeded()` per the CloudKit-safe rules above.\n\n---\n\n## Reminders — extend the existing system\n\n- Add `case activity` to `ReminderKind` (`NotificationScheduling.swift`) and to the `ReminderIdentifier.parse` kind loop.\n- Add `activityReminder(for: ActivityLog) -> PendingReminder?` to `DueReminderScheduler` — a near-copy of `vaccinationReminder`: returns nil when there's no `nextDueAt`/`id`; otherwise a one-shot on `nextDueAt` at the scheduler's default hour/minute. Title/body e.g. *\"Bath due\"* / *\"Time for {pet}'s bath\"*.\n- Add `syncActivity(_:)` and `cancelActivity(_:)` mirroring the vaccination methods. Keyed per log `id` (same as vaccinations).\n\n---\n\n## Timeline integration\n\nThe Timeline is already a unified projection (\"a typed thing that happened on a date, maybe with a next-one-due\"). Add Activities to it:\n\n- `TimelineKind`: add `case activity` (label \"Activities\", SF Symbol e.g. `shower`).\n- `TimelineReference`: add `case activity(ActivityLog)`.\n- `TimelineItem(activity:)` mapping — `date = performedAt`, `title = activityType.name`, `nextDue = nextDueAt` (so it flows into `dueSoon(...)` automatically).\n- Inject `ActivityStore` into `TimelineViewModel`; add its logs in `load()`; handle the `.activity` branch in `delete(_:)` (cancel the reminder, delete the log).\n\n**\"Due soon\" semantics:** the latest log of each type is the one with a live `nextDueAt`, so it's the one that surfaces. Older logs have past due dates and naturally drop out.\n\n---\n\n## UI\n\n- **Log / Edit sheet** (new log): activity-type picker **grouped into sections by category**, an inline **\"+ New activity\"** affordance (name + category; icon + cadence optional, cadence pre-filled from a sane default), date, note, a cadence row (\"Repeat every __ days\", pre-filled from the type, toggle-off allowed), and the photo section. New custom types default to category `.other` if the user doesn't pick one.\n- **Activity types management** (lightweight): list of types **sectioned by category**, with rename / change category / change cadence / change icon / archive. Reachable from the Activities list or Settings.\n- **Timeline** optionally exposes category as a coarse filter (in addition to the per-`TimelineKind` filter).\n- **List / Detail:** follow existing list+detail patterns. Detail for a type shows its log history plus \"last done / next due.\"\n- Follow `BrandFormSheet`, `Theme`, and existing list/detail conventions.\n\n---\n\n## Camera capture (applies to all photo sections)\n\n- New `CameraPicker` — a small `UIViewControllerRepresentable` over `UIImagePickerController(sourceType: .camera)`. The captured `UIImage` flows through the **same** downscale → JPEG (`preparingThumbnail` 1600px, 0.8 quality) → `onPick` / `onAdd` path already in the components.\n- Add a **\"Take photo\"** button (camera icon) beside \"Add photos\" in **both** `PendingPhotoSection` and `PhotoStripSection`, gated on `UIImagePickerController.isSourceTypeAvailable(.camera)` (so it's hidden on Simulator).\n- Lift the shared downscale/persist helper out of the two components so the camera and library paths don't duplicate it.\n- **Permissions:** `NSCameraUsageDescription` already exists in `project.yml` (added for the pairing QR scanner). Broaden its wording to also cover attaching photos to records.\n\n---\n\n## Testing\n\n- `ActivityStoreTests` — mirrors `HealthMarkerStoreTests` / `DoseLogStoreTests`: type create/list/archive, logging stamps `nextDueAt`, seeding is idempotent (runs once; no duplicates on second call).\n- `DueReminderSchedulerTests` — add cases for `activityReminder` (nil without due date; correct one-shot date) using the existing `FakeNotificationScheduler`.\n- `TimelineViewModelTests` — activity logs appear in the stream and in `dueSoon`.\n\n---\n\n## Build sequence (for the implementation plan)\n\n1. Core Data model: add `ActivityType`, `ActivityLog`, the `ActivityCategory` enum, and the `Photo.activityLog` relationship; generated NSManagedObject subclasses.\n2. `ActivityStore` (+ tests) including seeding.\n3. Notification layer: `ReminderKind.activity`, parse loop, `DueReminderScheduler` methods (+ tests).\n4. Timeline integration (+ tests).\n5. UI: log/edit sheet, type management, list/detail; wire stores into the app composition root.\n6. Camera capture: `CameraPicker`, shared helper extraction, buttons in both photo sections, usage-string wording."},"2026-07-04-logentry-full-unification-design":{"id":"2026-07-04-logentry-full-unification-design","col":"specs","title":"LogEntry Full Unification — Design","meta":{},"body":"# LogEntry Full Unification — Design\n\n**Date:** 2026-07-04\n**Status:** Approved direction (user chose \"full unification\"), pending spec review\n**Scope:** iOS app (`ios/PetHomepage`) + `SnapshotBuilder` reads. The Convex mirror **JSON contract stays identical** (dashboard untouched beyond what already ships).\n\n## Problem\n\nThe occurrence unification (2026-06-30) collapsed DiaryEntry/ActivityLog/DoseLog into `LogEntry`. Four record types still live as separate Core Data entities — `Vaccination`, `VetVisit`, `HealthMarker`, `SymptomEpisode` — each with its own store, editor plumbing, Timeline branch, reminder path, and mirror read. The user wants the write-side model to match the app's actual concept: *everything is a typed thing that happened on a date, maybe with a next-one-due.*\n\n## Decisions\n\n1. **All occurrences become `LogEntry` kinds.** Final kinds: `diary`, `activity`, `dose`, `vaccine`, `vet`, `marker`, `symptom`.\n2. **Definitions and children survive.** `Medication` and `ActivityType` are definitions (a prescription is not an occurrence). `VetRecommendation` and `SymptomEntry` are child rows and stay as entities, retargeted from their old parents to `LogEntry`.\n3. **Kind becomes explicit.** Today kind is derived from which ref is set; vaccine/vet/marker/symptom have no defining ref, so `LogEntry` gains `kindRaw: String` (default `\"diary\"`). Derivation is replaced by the stored kind everywhere; `LogStore` stamps it on create.\n4. **Sparse explicit columns, not a JSON blob.** Kind-specific fields are optional attributes on `LogEntry` (CloudKit-safe, queryable). Sparse-but-explicit was chosen over a fields blob deliberately.\n5. **Clean cutover, no data migration** — same call as the occurrence unification (existing local data is disposable; confirmed by the user for this same store on 2026-06-30). Old entities are deleted outright.\n6. **Per-kind editors stay.** VaccinationEditView, VetVisitDetailView, MarkerEditView, EpisodeStartView keep their UIs — they just read/write `LogEntry` through `LogStore`.\n7. **Capture sheet gains the new kinds** (absorbs the previously-planned \"photo → vet visit/vaccine/marker\" item): tagging a captured photo can now produce any occurrence kind. Vaccine/vet tags open a *prefilled editor sheet* (they have required fields); marker tag inline (value + unit fields appear in the review sheet); symptom excluded from capture v1 (episodes are spans, not snap-moments).\n\n## Entity model after\n\n**Deleted:** `Vaccination`, `VetVisit`, `HealthMarker`, `SymptomEpisode` (entities, model classes, stores).\n**Kept:** `Pet`, `Photo`, `Medication`, `ActivityType`, `Veterinarian`, `VetRecommendation`, `SymptomEntry`, `LogEntry`. (12 → 8.)\n\n### `LogEntry` — final shape\n\nExisting: `id, performedAt, note?, intervalDays, nextDueAt?, pet, activityType?, medication?, photos`.\n\nNew attributes (all optional / defaulted; CloudKit rules as usual):\n\n| attribute | type | used by |\n|---|---|---|\n| `kindRaw` | String, default `\"diary\"` | all |\n| `title` | String? | vaccine (vaccineName), vet (reason), symptom (title) |\n| `subtypeRaw` | String? | marker (`MarkerType` raw), symptom (category raw) |\n| `value` | Double, scalar, default 0 | marker |\n| `unit` | String? | marker |\n| `lotNumber` | String? | vaccine |\n| `administeredBy` | String? | vaccine |\n| `clinicName` | String? | vet |\n| `vetName` | String? | vet |\n| `diagnosis` | String? | vet |\n| `treatmentNotes` | String? | vet |\n| `statusRaw` | String? | symptom (`active`/`resolved`) |\n| `resolvedAt` | Date? | symptom |\n\nNew relationships:\n- `LogEntry.veterinarian` ↔ `Veterinarian.logEntries` (vaccine + vet visits attach a vet today).\n- `LogEntry.recommendations` ↔ `VetRecommendation.logEntry` (replaces `VetRecommendation.vetVisit`).\n- `LogEntry.symptomEntries` ↔ `SymptomEntry.logEntry` (replaces `SymptomEntry.episode`).\n- `Photo.vetVisit` and `Photo.vaccination` are deleted (photos use `Photo.logEntry`); `Photo.medication` stays (photos on the definition).\n- `Veterinarian.vetVisits`/`.vaccinations` relationships are deleted (replaced by `.logEntries`).\n\nField mapping from the old entities: `administeredAt`/`occurredAt`/`recordedAt`/`startedAt` → `performedAt`; `nextVisitDate`/`nextDueAt` → `nextDueAt`; `vaccineName`/`reason`/`title` → `title`; `markerTypeRaw`/`categoryRaw` → `subtypeRaw`.\n\n## LogStore — per-kind API (added; existing API unchanged)\n\nSplit into extensions by kind to keep the file navigable (`LogStore+Vaccine.swift`, `LogStore+Vet.swift`, `LogStore+Marker.swift`, `LogStore+Symptom.swift`):\n\n- Vaccine: `logVaccine(name:performedAt:nextDueAt:lotNumber:administeredBy:veterinarian:)`, `updateVaccine(...)`, `vaccines()`.\n- Vet: `logVetVisit(occurredAt:clinicName:vetName:reason:diagnosis:treatmentNotes:nextVisitDate:veterinarian:)`, `updateVetVisit(...)`, `vetVisits()`, `mostRecentVisitDate()`.\n- Marker: `logMarker(type:value:unit:recordedAt:)`, `markers()`, `latestMarker(of:)`, `series(of:)` (oldest-first; drives the weight trend).\n- Symptom: `startEpisode(category:title:startedAt:)`, `resolveEpisode(_:at:)`, `episodes()`; `SymptomEntryStore` retargets its parent to `LogEntry`.\n- All creates stamp `kindRaw`; all kind queries filter on it. `diaryEntries()` changes its predicate from \"no refs\" to `kindRaw == diary`.\n\n`VaccinationStore`, `VetVisitStore`, `HealthMarkerStore`, `SymptomEpisodeStore` are deleted. `VetRecommendationStore` retargets to `LogEntry`. `MarkerType`, `EpisodeStatus`, symptom category enums survive unchanged (they back `subtypeRaw`/`statusRaw`).\n\n## Consumers\n\n- **Timeline:** `TimelineReference` collapses to `logEntry(LogEntry)` + `medication(Medication)`; `TimelineKind` maps 1:1 from `LogEntry.kind` for filtering/tinting; `load()` = `logStore.allEntries()` + medications. `delete` branches by kind for reminder cleanup (vaccine cancel, vet-cadence resync, activity re-arm — same behaviors as today).\n- **Reminders:** `DueReminderScheduler.vaccinationReminder/syncVaccination/cancelVaccination` take `LogEntry`; `syncVetCadence(lastVisit:)` fed by `logStore.mostRecentVisitDate()`. `ReminderKind` cases unchanged (identifiers stay stable).\n- **Editors/VMs:** VaccinationEdit, VetVisitEdit/Detail, MarkerEdit, EpisodeStart/Detail VMs swap their store for `LogStore` and their record type for `LogEntry`. UI unchanged.\n- **Home (PetProfileView):** due-soon/recent slices already flow through TimelineViewModel; weight/next-vet tiles re-source from `LogStore` marker/vet queries.\n- **Extraction (`RecordIngestionService`):** writes scanned vaccines/vet visits via `LogStore` (meds unchanged).\n- **Mirror (`SnapshotBuilder`):** reads vaccines/vet visits/markers/symptoms from `LogStore`; DTO structs and JSON keys byte-identical; `schemaVersion` unchanged (shape didn't change).\n- **Capture sheet:** adds a \"Records\" chip group — Marker (inline value/unit), Vaccine and Vet visit (chip opens the prefilled editor with the photo pending). Symptom not offered in capture v1.\n\n## Non-goals\n\n- Multi-pet (next project, designed separately).\n- Dashboard/web changes.\n- Migrating existing Vaccination/VetVisit/HealthMarker/SymptomEpisode rows (clean cutover; user-confirmed disposable data).\n- Unifying `SymptomEntry` into `LogEntry` (child row of an episode; deliberately kept).\n\n## Testing\n\nPer-kind store tests (create/query/update mapping, kind stamping, series ordering), scheduler tests retargeted to `LogEntry`, Timeline aggregation/delete-per-kind, SnapshotBuilder JSON-contract test (golden-key assertions unchanged), capture-sheet tag routing for the new kinds, ingestion-service writes. Full suite green at every step.\n\n## kindRaw backfill (the one migration this DOES need)\n\nExisting `LogEntry` rows (diary/activity/dose created since the occurrence unification shipped) predate `kindRaw` and would all default to `\"diary\"`. A tiny idempotent backfill runs once at launch (alongside `seedDefaultsIfNeeded`): fetch entries, stamp `kindRaw` from the refs (`medication != nil` → dose, `activityType != nil` → activity, else diary), save. Safe to run repeatedly; covered by a store test.\n\n## Build sequence (same additive→narrow playbook as the occurrence unification)\n\n1. Model: `LogEntry` new attrs/relationships (additive), `kindRaw` stamped by creates, the launch backfill, and queries switched to it.\n2. Vaccine kind: LogStore+Vaccine, editor/VM, reminders, Timeline, ingestion, mirror read, tests — old entity untouched.\n3. Vet kind: same shape (incl. recommendations retarget + vet cadence).\n4. Marker kind: same shape (incl. series/trend + Home tile).\n5. Symptom kind: same shape (incl. SymptomEntry retarget, episode detail).\n6. Capture sheet: new kind tags (marker inline; vaccine/vet prefilled-editor handoff).\n7. Narrow: delete the four entities + stores + dead relationships/model classes; final full-suite pass."},"2026-07-04-multi-pet-design":{"id":"2026-07-04-multi-pet-design","col":"specs","title":"Multi-Pet — Design","meta":{},"body":"# Multi-Pet — Design\n\n**Date:** 2026-07-04\n**Status:** Draft for user review\n**Depends on:** full LogEntry unification (steps 1–7) landed; builds on the settled model.\n**User decisions (already made):** switching via the Home avatar; the desktop mirror shows the **active pet only**.\n\n## Problem\n\nThe app is single-pet by construction: `PetStore.currentPet()` returns the first `Pet` row, and every store scopes reads/writes through it. Households have more than one pet.\n\n## Approach\n\nKeep the `currentPet()` choke point — that's the whole trick. Every store, the Timeline, capture, seeding, and the mirror already flow through it, so multi-pet = (1) an **active-pet selection** behind `currentPet()`, (2) UI to **switch and add pets**, and (3) fixing the few places that silently assume \"one pet ever.\"\n\n## Design\n\n### 1. PetStore: active-pet selection\n\n- `pets() -> [Pet]` — all pets, sorted by name.\n- Active pet id persisted in `UserDefaults` (`activePetID`). `currentPet()` resolves: pet matching the stored id → else first pet (existing behavior; also covers a deleted/legacy id). `setActivePet(_ pet: Pet)` writes the id.\n- `ensurePet()` unchanged (creates the default pet when none exists) — new pets beyond the first are created explicitly via the switcher, `createPet(name:species:)` + `setActivePet`.\n- Active-pet choice is **per-device** (UserDefaults, not synced) — two devices on one iCloud account may show different active pets. Deliberate v1 simplification, noted here.\n\n### 2. Switcher UX (one adjustment to the chosen design)\n\nThe Home hero avatar tap is **already taken** (it opens the change-photo flow). Resolution: avatar tap opens a small menu — **Switch pet…** (submenu/sheet listing pets with avatar + name, checkmark on active), **Add pet…** (small sheet: name + species → `createPet` + `setActivePet`), **Change photo…** (the existing flow). One affordance, all three intents; no lost functionality.\n\n- Switching calls `setActivePet`, then `seedDefaultsIfNeeded()` (idempotent, pet-scoped — a new/other pet gets its starter activity types), then refreshes Home.\n- Other tabs already reload `.onAppear`, so they follow the active pet on next visit. Capture/review, Timeline, Diary, Care Team all inherit scoping via the stores.\n- Home's hero shows the active pet's name/photo (already does — it renders `currentPet`).\n\n### 3. Single-pet assumptions to fix\n\n- **Vet-cadence reminder identity:** `DueReminderScheduler.vetCadenceEntityID` is one fixed sentinel UUID — with two pets, their cadence reminders would overwrite each other. Fix: key the vet-cadence reminder by **`pet.id`** (kind stays `.vetCadence`). Sync/cancel call sites pass the active pet's id; per-pet cadence reminders coexist.\n- **Reminder copy:** bodies include the pet's name so notifications are unambiguous in a multi-pet home — \"Time for Bella's bath\", \"Rabies is due for Milo\". Applies to activity + vaccination reminders (read the name off the entry's `pet`); vet-cadence body gets the pet name from the synced pet.\n- **Seeding on switch/create** (covered above) — otherwise a second pet has no starter activity types.\n- **Mirror:** `SnapshotBuilder` reads through pet-scoped stores → automatically snapshots the active pet. The dashboard therefore shows whichever pet was most recently pushed (user-approved). No web changes.\n\n### 4. Explicit non-goals (v1)\n\n- **Deleting a pet** (destructive cascade across all records; defer until asked).\n- Per-pet web dashboards / multi-pet snapshot.\n- Syncing the active-pet choice across devices.\n- Per-pet notification sounds/times or any other per-pet settings.\n\n## Testing\n\n`PetStore` active-pet tests (persisted id resolution, fallback-to-first on unknown id, setActivePet roundtrip, pets() ordering); store-scoping test proving records created after a switch attach to the new active pet and queries only return its rows; vet-cadence per-pet reminder identity (two pets → two pending cadence reminders); reminder-body pet-name assertions; seeding-on-switch idempotency.\n\n## Build shape\n\n1. PetStore active-pet mechanics + tests (no UI).\n2. Reminder fixes: per-pet vet-cadence identity + pet-name copy + tests.\n3. Switcher UI (avatar menu, switch sheet, add-pet sheet) + seeding-on-switch wiring."},"2026-06-27-testflight-and-dashboard":{"id":"2026-06-27-testflight-and-dashboard","col":"devlog","title":"Shipped to TestFlight + reshaped the app around a unified Timeline","meta":{"type":"devlog","title":"Shipped to TestFlight + reshaped the app around a unified Timeline","date":"2026-06-27","phase":"Post-v1 — CI/CD + UX polish"},"body":"**Stood up a GitHub Actions → TestFlight pipeline (edit anywhere → push → OTA to the phone), closed the loop on the AI scan + device pairing features, then consolidated the 5-tab app into a Timeline + dashboard Home and did a long UI-polish pass — all shipped as one TestFlight build.**\n\n## What got done\n- **CI/CD to TestFlight.** A macOS GitHub Actions workflow now archives (Release), exports, and uploads to TestFlight on every push to `main`, using an App Store Connect API key (cloud-managed signing, no fastlane match). Repo went private on GitHub; secrets set via `gh`. The phone updates over the air — no cable, buildable from a Linux VPS via `git push`.\n- **In-app \"Scan a record\"** — wired the previously-unreachable AI extraction pipeline: a PhotosPicker/PDF picker → `/api/extract` (Claude) → review → save into the right stores, presented from a Home card. Endpoint + secret configurable in Settings.\n- **Device pairing (QR + short code)** to replace the 70-char token copy-paste: dashboard mints a short-lived single-use code shown as a QR *and* typable code; the app scans/enters it at `/mirror/pair` and self-configures (token → Keychain, mirroring on). Verified the full claim→token→push chain headlessly.\n- **Tab consolidation 5 → 3** (Home · Timeline · Health). New **Timeline** aggregates all five record types into one date-sorted, filterable stream (tap → existing editor, FAB → add, swipe → delete with reminder cleanup). **Home** became a dashboard: at-a-glance stats, quick actions (log dose/weight/symptom), upcoming, recent.\n- **UI iteration batch:** structured medication frequency (\"Every N days/weeks/months\") that drives the reminder; \"Next reminder\" anchors to the frequency, not today; pet avatar (tap the hero); pet name in the header; Name/Species moved to Settings (set-once); weight unit is a picker defaulting to **lb**; consistent `brandSheet()` on every add/edit sheet; Timeline brand hero; and a real **app icon** (white paw on violet).\n- **Web housekeeping:** relaxed the Convex Auth password policy (was 8+upper/lower/digit), fixed sign-up redirecting to a non-existent `/onboarding`, and redeployed the dashboard to Vercel.\n\n## Decisions\n- **Build on GitHub's macOS runner, not the VPS.** iOS can't compile/sign on Linux, so the VPS is only an editor + `git push`; the runner does everything. Chose API-key cloud signing over `match` to avoid a separate certs repo.\n- **Medication frequency stays a string, parsed into a `MedFrequency` value type** — avoids a Core Data/CloudKit migration. Daily uses a repeating trigger; other cadences schedule a one-shot on the next due date, recomputed each sync.\n- **Timeline is the single delete/add surface.** Consolidation dropped per-type delete; restored it as swipe-to-delete on Timeline rows (moved into the view-model so it's testable).\n- **Identity (name/species) belongs in Settings** since it's set once; Home is a pure dashboard.\n- Planned but deferred: the full 5-entities-→-one-`HealthEvent` data-model unification.\n\n## Issues\n- **The app icon was silently rendering black** — the AppKit CLI bitmap-context approach never actually drew; SwiftUI `ImageRenderer` (run on the main actor) fixed it. The earlier TestFlight build shipped a black icon.\n- **First TestFlight build failed validation** on three things, now baked into the repo: missing app icon (added a 1024² no-alpha asset), no `UISupportedInterfaceOrientations`, and the runner defaulting to Xcode 16.4 — App Store now requires the **iOS 26 SDK** (added `setup-xcode` latest-stable).\n- **Export failed with \"Cloud signing permission error\"** until the App Store Connect API key was regenerated as **Admin** (App Manager can't mint a distribution cert).\n- **`aps-environment: development`** would have broken the distribution build — removed it (app uses local notifications only).\n- **Flaky test-host relaunch** intermittently reports `TEST FAILED` with 0 real failures (CloudKit-sim hiccup); a clean re-run is green. Also fixed a real crash where `PersistenceController` reloaded the model per-instance (\"Multiple NSEntityDescriptions claim 'Pet'\") — now loads it once.\n- **OMC autopilot kept self-triggering**: its keyword detector fires on prompts that merely mention \"autopilot\", and a stale phantom state file under the (cwd-dependent) `.omc` dir kept the Stop hook nagging. Disabled the keyword hook (`OMC_SKIP_HOOKS=UserPromptSubmit`, needs restart), cleaned the version cache, and removed the phantom state files.\n\n## What to remember\n- App Store Connect API key for CI **must be Admin** (cloud signing mints a distribution cert).\n- iOS app icons: single 1024×1024, **no alpha**; generate via SwiftUI `ImageRenderer` on the main actor (not AppKit CLI bitmap contexts).\n- CI sets `CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER` so build numbers stay unique.\n- CloudKit must be **deployed to Production** (CloudKit Console, from the Development env) for sync to work in TestFlight/release builds — separate from the build succeeding.\n- TestFlight **internal** testing needs no Apple review; **external** testers trigger a one-time Beta App Review.\n\n---\n\n## Commits\n- `e135e40` feat(ios): app icon — white paw on brand violet\n- `234b169` feat(ios): next reminder anchors to the frequency, not today\n- `248e5af` feat(ios): default weight unit to lb\n- `ecf4e36` style(ios): brand Timeline + clearer medication/marker forms\n- `4ad6356` style(ios): consistent brandSheet() on all add/edit sheets\n- `c6e616c` refactor(ios): move Name + Species into Settings\n- `e330ec8` feat(ios): pet name in the header, species on the Health tab\n- `e7a44b5` feat(ios): pet profile photo (tap the hero avatar)\n- `1cb3735` test(ios): move Timeline delete into the view-model + cover it\n- `7d8e386` feat(ios): swipe-to-delete on Timeline rows\n- `bee1c51` feat(ios): Home dashboard — at-a-glance, quick actions, upcoming, recent\n- `53cfba4` feat(ios): Timeline FAB + dashboard-style Home\n- `b9f11ee` feat(ios): structured medication frequency that drives the reminder\n- `5a36ce9` fix(ios): satisfy App Store validation (icon, orientations, iOS 26 SDK)\n- `bb1083f` ci: declare export-compliance exemption\n- `6bea765` ci: build + ship to TestFlight from a macOS GitHub Actions runner\n- `474e952` feat(ios): consolidate 5 tabs → 3 with a unified Timeline + \"due soon\" Home\n- `abb2112` feat: device pairing (QR + short code)\n- `9a0bccd` fix(web): relax password policy + send sign-ups to /dashboard\n- `9db0744` feat(ios): wire up the in-app record-upload (Scan a record)\n- `1a34b91` docs: restyle autonomous-build writeups as a 4-page HTML site\n\n## Tomorrow's plan\n- Confirm the new TestFlight build went VALID and test on-device.\n- Optional fuller card redesign of specific add/edit sheets.\n- Eventually: data-model unification (5 entities → one `HealthEvent`), plus photos-on-records and a photo diary."},"2026-07-04-activities-camera-and-logentry-unification":{"id":"2026-07-04-activities-camera-and-logentry-unification","col":"devlog","title":"Activities, camera-first capture, and the full LogEntry unification","meta":{"lore_type":"devlog","created":"2026-07-04","title":"Activities, camera-first capture, and the full LogEntry unification","date":"2026-07-04","day":"8"},"body":"**Shipped the Activities feature, made the app camera-first (center camera tab + OCR tag suggestion), and completed the full data-model unification: 12 Core Data entities → 8, with everything that happens on a date now a `LogEntry` kind.**\n\n## What got done\n- **Activities**: user-defined `ActivityType`s (pre-seeded, editable, categorized, per-type reminder times) + logged occurrences with cadence → \"Due soon\" + notifications. Type editor, archive, icon picker.\n- **Camera capture everywhere**: \"Take photo\" in the shared photo sections, then a **center camera tab** (Home · Timeline · 📷 · Diary · Care Team) → instant viewfinder → review-and-tag sheet. A photo becomes a diary entry, activity, dose, marker (inline value), or hands off to the prefilled vaccine/vet editors.\n- **On-device OCR tag suggestion**: Vision OCR + whole-word fuzzy match against the user's med/activity names pre-selects the matching chip with a ✨ — no network, no API cost.\n- **Occurrence unification** (phase 1): DiaryEntry + ActivityLog + DoseLog → one `LogEntry` behind one `LogStore`.\n- **Full unification** (phase 2): Vaccination, VetVisit, HealthMarker, SymptomEpisode also became `LogEntry` kinds (`kindRaw`: diary/activity/dose/vaccine/vet/marker/symptom; sparse optional columns for kind fields). Definitions (Medication, ActivityType) and children (VetRecommendation, SymptomEntry) survived, retargeted. Final model: 8 entities.\n- **Mirror**: activity logs now render on the desktop dashboard; all snapshot reads re-sourced through LogStore with the JSON contract byte-identical.\n- **Multi-pet**: active-pet selection behind `PetStore.currentPet()`, avatar menu (Switch/Add/Change photo), per-pet vet-cadence reminder identity, pet names in notification copy, seeding on switch.\n- **Diary merged into Timeline**: diary entries flow into the stream as a filter chip; the photo grid became a Stream|Photos in-tab view mode; Diary tab deleted (4-tab layout: Home · Timeline · 📷 · Care Team).\n- Device bug fixes: camera collapsing (nested-sheet → `.fullScreenCover` + explicit dismiss), Contacts import dropping picks (`CNContactPickerViewController` must be *presented by* a VC, not be a sheet's root).\n\n## Decisions\n- **Definitions vs occurrences** is the load-bearing split: occurrences unify into LogEntry; definitions (Medication, ActivityType) and child rows stay as entities. \"Full unification\" ≠ god-object.\n- Kind is an explicit stored `kindRaw` (with a one-time launch backfill from refs), not derived — vaccine/vet/marker/symptom have no defining ref.\n- Sparse explicit columns over a JSON fields blob (CloudKit-safe, queryable).\n- Clean cutover migrations (data disposable, user-confirmed) — additive → per-kind consumer migration → narrow deletion, full suite green at every step.\n- Camera-centric without compromising utility: camera owns the center tab; structured logging keeps Timeline's \"+\" (Home's capture bar removed as redundant).\n- OCR before paid AI: try on-device Vision first; Claude fallback only with evidence it's needed.\n\n## Issues\n- `xcodebuild test` exits 65 with \"TEST FAILED\" **even when all tests pass**: the host app crashes once at launch on the simulator (CloudKit `CKAccountStatusNoAccount`), xcodebuild restarts and everything passes. Judge runs by counting `' passed ('` vs `' failed ('` lines. Confirmed pre-existing on main via a worktree baseline.\n- Swift optional-enum gotcha shipped and got caught in review: `optionalEnum == .none` resolves to `Optional.none`, so nil \"matched\" and lit a phantom ✨ on the Note-only chip. Spell out `CaptureTag.none`.\n- `preparingThumbnail(of:)` is point-based — on a 3× device it returns 3× the pixels you asked for; the downscaler uses an explicit `UIGraphicsImageRenderer(scale: 1)`.\n- Presenting a sheet in the same SwiftUI transaction as dismissing a full-screen cover silently drops the sheet — stage state and promote it in `onDismiss`.\n- Known flaky test: `ActivityLogEditViewModelTests.testSaveCancelsPriorLatestReminderOfSameType` (cross-test Core Data pollution; passes in isolation).\n- One subagent stalled mid-narrow-pass (watchdog); its deletions were complete — finished the DiaryStore cleanup inline and verified. Ledgers made recovery trivial.\n\n## What to remember\n- The whole app scopes through `PetStore.currentPet()` — that choke point is what made both unification and multi-pet cheap.\n- `LogStore` is the single occurrence API; per-kind extensions live in `LogStore+Vaccine/Vet/Marker/Symptom.swift`. Surviving enums moved to `MarkerType.swift`, `EpisodeStatus.swift`, `SymptomCategory.swift`.\n- Mirror `schemaVersion` is 4 (activity_logs added); dashboard parses all new keys optionally.\n- Simulator destination that works: **iPhone 17 Pro** (\"iPhone 16\" doesn't resolve).\n\n---\n\n## Commits\n01fd0f8 feat: merge Diary into Timeline — diary chip, Stream|Photos view mode, 4-tab layout\n7e9a30e feat: pet switcher — avatar menu, switch/add sheets, seeding on switch\na74f098 feat: per-pet vet-cadence identity + pet names in reminder copy\n956b7f6 feat: active-pet selection in PetStore\n2a7d038 docs: multi-pet design spec\nd484021 refactor: delete Vaccination/VetVisit/HealthMarker/SymptomEpisode entities (unified into LogEntry)\n5b9b89c feat: capture photos into markers, vaccines, and vet visits\n8ad71b3 refactor: symptom episodes as LogEntry kind\n4917306 refactor: health markers as LogEntry kind\nb0e8e81 refactor: vet visits as LogEntry kind\n24d2723 refactor: vaccine records as LogEntry kind\n063e1f1 refactor: LogEntry gains explicit kindRaw + record-kind columns (additive)\n7c15233 feat: per-activity reminder times\n6dd5714 feat: remove Home capture bar (center camera tab + Timeline + cover it)\n2a7e577 feat: mirror activity logs to the desktop dashboard\n8745697 docs: full LogEntry unification design spec (12 entities → 8)\nc89d66e fix: phantom ✨ on Note-only chip — bare .none resolved to Optional.none\nca1cc84 feat: on-device OCR tag suggestion in capture review\n562ae3b fix: present capture review sheet from camera cover's onDismiss\ndaf1703 feat: center camera tab + capture review-and-tag sheet\ncb9b11e feat: dashboard Capture hub — bottom Capture button routing to all editors\n117672a refactor: delete DiaryEntry/ActivityLog/DoseLog entities (unified into LogEntry)\n4ac2696 refactor: migrate dose logging to LogEntry/LogStore; remove DoseLogStore\nb1a97da refactor: migrate Diary occurrences to LogEntry/LogStore\nec6c399 refactor: migrate Activity occurrences to LogEntry/LogStore\n2257d02 fix: camera capture and Contacts import both collapsing on device\n48d9a51 feat: add unified LogEntry entity + LogStore (additive foundation)\n8c09498 feat: move \"Scan a record\" from dashboard into the Timeline add menu\n6252bb2 feat: group low-frequency record types under a Health record submenu\nee05d1c feat: activity follow-ups — type editor, delete re-arms reminder, UI polish\ndae24aa feat: activity log sheet, type management, and Timeline wiring\nb3e1313 fix: propagate edit-path save error in ActivityLogEditViewModel\ne50df43 feat: ActivityLogEditViewModel with cadence + reminder sync\ne3c21b2 feat: surface activity logs in the unified Timeline\n86f2fe6 feat: camera capture in shared photo sections\n0f4b565 feat: add activity due reminders to DueReminderScheduler\nf9fba7b feat: seed default activity types (idempotent, dedupe by name)\n1c3081c feat: add ActivityStore type CRUD, logging, and queries\n66c4136 feat: add ActivityType and ActivityLog Core Data entities\n30c816f feat: add ActivityCategory enum"}}};
const COLW = { architecture:"New engineer? Start here", features:"PM &amp; design: start here",
  planning:"Founder brain: why + roadmap", specs:"Frozen intent, per feature", devlog:"What just happened" };
const byId = DATA.docs;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- tiny markdown renderer ---------- */
function md(src){
  const fences = [];
  src = src.replace(/```([\s\S]*?)```/g, (_,c)=>{ fences.push(c.replace(/^\w*\n/,"")); return "␀F"+(fences.length-1)+"␀"; });
  const lines = src.split("\n"); const out = []; let i=0;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>")
    .replace(/\[\[([^\]]+)\]\]/g,(_,n)=>{ const d=resolve(n); return d?`<span class="wiki" onclick="go('doc/${d}')">${n}</span>`:`<span class="wiki dead" title="removed note">${n}</span>`; })
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t2,u)=>{ if(/^https?:/.test(u)) return `<a href="${u}" target="_blank" rel="noopener">${t2}</a>`; const d=resolve(u.replace(/\.md$/,"").split("/").pop()); return d?`<span class="wiki" onclick="go('doc/${d}')">${t2}</span>`:t2; })
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:)!?]|$)/g,"$1<i>$2</i>");
  while(i<lines.length){
    let L = lines[i];
    const f = L.match(/^␀F(\d+)␀/); if(f){ out.push("<pre><code>"+esc(fences[+f[1]])+"</code></pre>"); i++; continue; }
    if(/^\s*$/.test(L)){ i++; continue; }
    const h = L.match(/^(#{1,4}) (.+)/); if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^---+$/.test(L)){ out.push("<hr>"); i++; continue; }
    if(/^\|/.test(L)){ const rows=[]; while(i<lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      let html = '<div class="tablewrap"><table><thead><tr>'+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      for(let r=2;r<rows.length;r++) html += "<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
      out.push(html+"</tbody></table></div>"); continue; }
    if(/^>/.test(L)){ const q=[]; while(i<lines.length && /^>/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; }
      out.push("<blockquote><p>"+q.map(inline).join("<br>")+"</p></blockquote>"); continue; }
    const li = L.match(/^(\s*)([-*]|\d+\.) (.+)/);
    if(li){ const ord = /\d/.test(li[2]); const items=[];
      while(i<lines.length){ const m=lines[i].match(/^(\s*)([-*]|\d+\.) (.+)/);
        if(m){ items.push({ind:m[1].length,txt:m[3]}); i++; }
        else if(/^\s{2,}\S/.test(lines[i]) && items.length){ items[items.length-1].txt += " "+lines[i].trim(); i++; }
        else break; }
      let html=(ord?"<ol>":"<ul>"); let depth=0;
      for(const it of items){ const d=it.ind>=2?1:0;
        if(d>depth){html+="<ul>";depth=d;} else if(d<depth){html+="</ul>";depth=d;}
        let t=it.txt.replace(/^\[([ x])\] /,(_,c)=>`<input type="checkbox" disabled ${c==="x"?"checked":""}> `);
        html+="<li>"+inline(t)+"</li>"; }
      if(depth)html+="</ul>"; html+=(ord?"</ol>":"</ul>"); out.push(html); continue; }
    const para=[L]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#|\||>|---|[-*] |\d+\. |␀)/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("\n");
}
function resolve(name){
  const n = name.trim().toLowerCase();
  if(byId[n]) return n;
  for(const id in byId){ if(id.toLowerCase()===n || byId[id].title.toLowerCase()===n) return id;
    if(id.replace(/^\d+-/,"")===n.replace(/^\d+-/,"")) return id; }
  return null;
}

/* ---------- views ---------- */
const statusOf = d => (d.meta.status || (d.col==="devlog"||d.col==="specs"?"":"")) || "";
function chips(d){
  let h="";
  const s=statusOf(d); if(s) h+=`<span class="chip ${s}"><span class="dot"></span>${s}</span>`;
  if(d.meta.area) h+=`<span class="chip">${esc(d.meta.area)}</span>`;
  if(d.meta.entry_point) h+=`<span class="chip">↳ ${esc(d.meta.entry_point)}</span>`;
  if(d.meta.since||d.meta.date) h+=`<span class="chip">${esc(d.meta.since||d.meta.date)}</span>`;
  return h;
}
function landing(){
  const cards = DATA.collections.map(c=>`
    <button class="card" onclick="go('doc/${c.docs[0]}')">
      <h3>${c.label} <span class="n">${c.docs.length}</span></h3>
      <p>${c.desc}</p><div class="who">${COLW[c.id]||""}</div>
    </button>`).join("");
  return `<div class="hero"><div class="eyebrow">pet-homepage · documentation</div>
      <h2>Everything about Homepage, one pretty place.</h2>
      <p class="desc">The iOS-first pet health tracker — its features, architecture, plans, and history. ${Object.keys(byId).length} docs across ${DATA.collections.length} collections.</p></div>
    <div class="grid">${cards}</div>
    <div class="routing"><h3>Who reads what</h3>
      <p><b>What can it do?</b> → Features · <b>Why does it exist?</b> → Planning · <b>How is it built?</b> → Architecture ·
      <b>What did we intend?</b> → Specs · <b>What just happened?</b> → Devlog · <b>ADRs</b> → none yet (docs/decisions/ is empty — first architectural decision record still to come).</p></div>`;
}
function docView(id){
  const d = byId[id]; const col = DATA.collections.find(c=>c.id===d.col);
  const idx = col.docs.indexOf(id);
  const prev = col.docs[idx-1], next = col.docs[idx+1];
  const pn = (prev||next)?`<div class="pn">
      ${prev?`<button onclick="go('doc/${prev}')"><span class="lbl">← Previous</span>${esc(byId[prev].title)}</button>`:"<span></span>"}
      ${next?`<button onclick="go('doc/${next}')" style="text-align:right"><span class="lbl">Next →</span>${esc(byId[next].title)}</button>`:""}
    </div>`:"";
  return `<div class="hero"><div class="eyebrow">${col.label} · ${idx+1} of ${col.docs.length} ${chips(d)}</div>
      <h2>${esc(d.title)}</h2></div>
    <article>${md(d.body)}</article>${pn}`;
}

/* ---------- nav + routing ---------- */
function nav(filter){
  const q = (filter||"").toLowerCase();
  let html=""; let any=false;
  for(const c of DATA.collections){
    const docs = c.docs.filter(id => !q || byId[id].title.toLowerCase().includes(q) || byId[id].body.toLowerCase().includes(q));
    if(!docs.length) continue; any=true;
    html += `<div class="navlabel">${c.label}<span class="n">${docs.length}</span></div>`;
    for(const id of docs){ const d=byId[id]; const s=statusOf(d)||"none";
      html += `<button class="navdoc${location.hash==="#doc/"+id?" on":""}" onclick="go('doc/${id}')">
        <span class="dot ${s}"></span><span>${esc(d.title)}</span></button>`; }
  }
  document.getElementById("nav").innerHTML = html || `<div id="nomatch" style="display:block">Nothing matches “${esc(filter)}”.</div>`;
}
function go(route){ location.hash = route; }
function render(){
  const h = location.hash.replace(/^#/,"");
  const page = document.getElementById("page");
  if(h.startsWith("doc/") && byId[h.slice(4)]) page.innerHTML = docView(h.slice(4));
  else page.innerHTML = landing();
  nav(document.getElementById("q").value);
  document.getElementById("main").scrollTop = 0;
}
window.addEventListener("hashchange", render);
document.getElementById("q").addEventListener("input", e => nav(e.target.value));
document.addEventListener("keydown", e => {
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); document.getElementById("q").focus(); }
});
render();
</script>
