<title>Homepage · Docs</title>
<style>
  :root{
    --violet:#6C4CF1; --violet2:#9B5CF6; --coral:#FF6B5C;
    --bg:#F4F3FA; --card:#FFFFFF; --ink:#16142A; --soft:#6E6A86;
    --ok:#12B886; --warn:#F59E0B; --line:rgba(22,20,42,.08);
    --disp:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.65}
  #app{display:grid;grid-template-columns:288px 1fr;height:100vh}
  a{color:var(--violet)}
  ::selection{background:rgba(108,76,241,.18)}

  /* ---------- sidebar ---------- */
  #side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px;cursor:pointer}
  #brand .paw{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:19px;
    background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 6px 14px rgba(108,76,241,.35)}
  #brand h1{font-family:var(--disp);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
  #brand .sub{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--soft);text-transform:uppercase}
  #search{margin:0 14px 10px;position:relative}
  #search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;
    padding:9px 12px;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
  #search input:focus-visible{border-color:var(--violet);box-shadow:0 0 0 3px rgba(108,76,241,.15)}
  #search kbd{position:absolute;right:9px;top:8px;font-family:var(--mono);font-size:10.5px;color:var(--soft);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--card)}
  #nav{overflow-y:auto;padding:4px 14px 24px;min-height:0}
  .navlabel{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);
    margin:16px 4px 6px;display:flex;justify-content:space-between;align-items:baseline}
  .navlabel .n{font-family:var(--mono);font-size:10px}
  .navdoc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;cursor:pointer;
    font:inherit;font-size:13.5px;color:var(--ink);padding:6px 10px;border-radius:9px;line-height:1.35}
  .navdoc:hover{background:var(--bg)}
  .navdoc.on{background:var(--violet);color:#fff;font-weight:600}
  .navdoc:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.shipped,.dot.current{background:var(--ok)} .dot.frozen{background:var(--warn)}
  .dot.superseded{background:var(--soft)} .dot.none{background:transparent;border:1.5px solid var(--line)}
  .navdoc.on .dot.none{border-color:rgba(255,255,255,.5)}
  #nomatch{color:var(--soft);font-size:13px;padding:12px 10px;display:none}

  /* ---------- main ---------- */
  #main{overflow-y:auto;min-height:0;scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){#main{scroll-behavior:auto} .card,.navdoc{transition:none!important}}
  #page{max-width:860px;margin:0 auto;padding:28px 40px 80px}

  .hero{background:linear-gradient(135deg,var(--violet),var(--violet2));border-radius:24px;color:#fff;
    padding:30px 32px 26px;box-shadow:0 14px 30px rgba(108,76,241,.28);margin-bottom:28px}
  .hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hero h2{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,38px);margin:8px 0 0;
    letter-spacing:-.015em;text-wrap:balance;line-height:1.12}
  .hero .desc{margin:10px 0 0;opacity:.9;max-width:56ch}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;
    background:rgba(255,255,255,.16);border-radius:99px;padding:3px 11px;text-transform:none}
  .chip .dot{width:6px;height:6px}
  .chip.shipped .dot,.chip.current .dot{background:#7BF0C9} .chip.frozen .dot{background:#FFD48A}
  .chip.superseded .dot{background:rgba(255,255,255,.6)}

  /* landing cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;cursor:pointer;
    text-align:left;font:inherit;color:var(--ink);transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(22,20,42,.04)}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(22,20,42,.09)}
  .card:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .card h3{font-family:var(--disp);font-weight:800;font-size:17px;margin:0 0 5px;display:flex;align-items:baseline;gap:8px}
  .card h3 .n{font-family:var(--mono);font-size:11px;color:var(--violet);font-weight:600}
  .card p{margin:0;color:var(--soft);font-size:13.5px;line-height:1.5}
  .card .who{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
  .routing{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-top:26px}
  .routing h3{font-family:var(--disp);font-weight:800;margin:0 0 8px;font-size:15px}
  .routing p{margin:0;color:var(--soft);font-size:13.5px}
  .routing b{color:var(--ink)}

  /* ---------- article ---------- */
  article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 44px 40px;
    box-shadow:0 6px 18px rgba(22,20,42,.05)}
  article>*:first-child{margin-top:0}
  article h1{display:none}
  article h2{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:34px 0 10px;text-wrap:balance}
  article h3{font-family:var(--disp);font-weight:800;font-size:17px;margin:26px 0 8px}
  article h4{font-size:14px;font-weight:700;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft)}
  article p,article li{max-width:70ch}
  article li{margin:3px 0}
  article hr{border:0;border-top:1px solid var(--line);margin:28px 0}
  article blockquote{margin:14px 0;padding:10px 18px;border-left:3px solid var(--violet2);
    background:rgba(108,76,241,.05);border-radius:0 12px 12px 0;color:var(--soft)}
  article blockquote p{margin:4px 0}
  article code{font-family:var(--mono);font-size:.86em;background:rgba(108,76,241,.08);
    border-radius:6px;padding:1.5px 6px}
  article pre{background:#1D1A33;color:#EDEAFF;border-radius:14px;padding:18px 20px;overflow-x:auto;
    font-family:var(--mono);font-size:12.5px;line-height:1.55}
  article pre code{background:none;padding:0;color:inherit;font-size:inherit}
  .tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:14px}
  article table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  article th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);text-align:left;
    background:var(--bg);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  article td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  article tr:last-child td{border-bottom:0}
  .wiki{color:var(--violet);border-bottom:1.5px dotted rgba(108,76,241,.5);cursor:pointer;font-weight:500}
  .wiki.dead{color:var(--soft);border-bottom-style:dashed;cursor:default}
  input[type=checkbox]{accent-color:var(--violet)}
  .pn{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
  .pn button{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 18px;font:inherit;
    font-size:13px;cursor:pointer;color:var(--ink);max-width:48%;text-align:left}
  .pn button:hover{border-color:var(--violet)} .pn button:focus-visible{outline:2px solid var(--violet)}
  .pn .lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  mark{background:rgba(255,107,92,.28);border-radius:3px;padding:0 1px}

  @media (max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #side{max-height:44vh;border-right:0;border-bottom:1px solid var(--line)}
    #page{padding:20px 16px 60px}
    article{padding:24px 20px}
  }
</style>

<script>
const DATA = {"collections":[{"id":"architecture","label":"Architecture","desc":"How the system hangs together — one page.","docs":["architecture"]},{"id":"features","label":"Features","desc":"What exists today: capabilities, status + entry points.","docs":["001-home-dashboard","002-unified-timeline","003-camera-capture","004-ocr-tag-suggestion","005-activities","006-medications","007-vaccines","008-vet-visits","009-health-markers","010-symptom-tracking","011-diary-and-photos","012-care-team","013-multi-pet","014-reminders","015-ai-record-scan","016-desktop-mirror"]},{"id":"planning","label":"Planning","desc":"Why this product should exist — Phase-0 chapters + roadmap.","docs":["00-overview","01-problem-and-users","05-pricing","06-competition","10-hardware-vision","11-vet-partnerships","12-risks-and-open-questions","13-roadmap"]},{"id":"specs","label":"Specs","desc":"Frozen designs, as approved.","docs":["2026-06-19-pet-homepage-ios-health-app-design","2026-06-29-care-activities-design","2026-07-04-logentry-full-unification-design","2026-07-04-multi-pet-design"]},{"id":"devlog","label":"Devlog","desc":"What happened, day by day.","docs":["2026-06-27-testflight-and-dashboard","2026-07-04-activities-camera-and-logentry-unification"]}],"docs":{"architecture":{"id":"architecture","col":"architecture","title":"Architecture","meta":{},"body":"# Architecture\n\n*Last updated 2026-07-04 (post LogEntry unification + multi-pet). Audience: anyone — PM, designer, or engineer — who needs the shape of the system without reading code. The feature-by-feature view lives in [`docs/features/`](features/index.md).*\n\n## The system at a glance\n\n```\n┌─────────────────────────────  iPhone (system of record)  ────────────────────────────┐\n│                                                                                       │\n│  SwiftUI views ── ViewModels ── Stores ── Core Data ⇄ CloudKit (private iCloud sync)  │\n│       │                                                                               │\n│       ├─ Local notifications (meds, vaccines, vet cadence, activities)                │\n│       └─ Camera / photo library / Contacts / Vision OCR (all on-device)               │\n│                                                                                       │\n└───────────────┬───────────────────────────────────────────────┬──────────────────────┘\n                │  snapshot push (one-way, token-auth)           │  document scan (photo/PDF)\n                ▼                                                ▼\n┌────────────  Web (Next.js + Convex)  ────────────┐   ┌─────────────────────────┐\n│  Convex: mirrors, mirrorTokens, pairingCodes     │   │  /api/extract           │\n│  Dashboard: read-only render of the snapshot     │   │  (Claude vision →       │\n│  Sign-in: Convex Auth · Pairing: code/QR → token │   │   parsed records)       │\n└──────────────────────────────────────────────────┘   └─────────────────────────┘\n```\n\n**The iOS app owns all pet data.** iCloud (CloudKit) syncs it between the user's devices. The web side holds only: auth for the dashboard, pairing/capability tokens, and the latest opaque snapshot per user. Nothing on the web can write pet data.\n\n## The data model: one occurrence entity\n\nThe core idea, arrived at through two unification passes: **everything that happens on a date is one row type.**\n\n```\nLogEntry  ─ the occurrence ─  kind: diary | activity | dose | vaccine | vet | marker | symptom\n   ├─ always: performedAt, note?, photos[], pet\n   ├─ repeatable things: intervalDays, nextDueAt   (drives \"Due soon\" + reminders)\n   └─ kind-specific (sparse): value/unit (marker) · lotNumber/administeredBy (vaccine)\n                              clinicName/vetName/diagnosis/treatmentNotes (vet)\n                              statusRaw/resolvedAt (symptom) · title, subtypeRaw\n```\n\nAround it, only things that are genuinely *not* occurrences remain entities — **8 total**:\n\n| Entity | Role |\n|---|---|\n| `LogEntry` | every occurrence (7 kinds above) |\n| `Pet` | the animal; everything scopes to a pet |\n| `Medication` | a *definition* (prescription) — doses are LogEntries pointing at it |\n| `ActivityType` | a *definition* (Bath, Nail trim…) — user-editable, pre-seeded |\n| `Veterinarian` | care-team contact, attachable to records |\n| `VetRecommendation` | child rows of a vet-visit LogEntry |\n| `SymptomEntry` | dated check-ins, child rows of a symptom LogEntry |\n| `Photo` | image + caption, attached to a LogEntry, a Medication, or the Pet |\n\nWhy it's this way: the **definition vs. occurrence** split is load-bearing. Occurrences share one shape (when, what, note, photos, maybe next-due), so they share one table and one store — that's what makes the unified Timeline, \"Due soon,\" and capture-tagging need no special cases. Definitions differ wildly (a prescription ≠ a grooming preset) and are the things users name, edit, and archive — so they stay distinct.\n\n## Layers on the iOS side\n\n- **Stores** (one per concern) are the only things that touch Core Data: `LogStore` (all occurrences; per-kind extensions for vaccine/vet/marker/symptom), `PetStore` (pets + the *active pet*), `MedicationStore`, `ActivityStore` (types + seeding), `VeterinarianStore`, `VetRecommendationStore`, `SymptomEntryStore`, `DiaryStore` (medication photos only).\n- **Everything is pet-scoped through one choke point:** `PetStore.currentPet()` — the active pet (persisted per device). This single indirection is what made multi-pet a small feature.\n- **ViewModels** (`@Observable`) own flows and side-effects; notably, **reminder scheduling is ViewModel-driven, never store-driven** — a store saves, then the ViewModel syncs notifications.\n- **Notifications**: a pure, testable scheduler (`DueReminderScheduler`, `MedicationReminderScheduler`) behind a protocol; only one adapter touches the real notification center. Reminders are keyed `(kind, recordID)` so schedule/replace/cancel are idempotent.\n- **Capture pipeline**: center camera tab → `CameraPicker` (full-screen) → downscale (pixel-capped JPEG) → review-and-tag sheet → the matching `LogStore` create + photo attach. Vision OCR (`TagSuggester`) suggests a tag by matching label text against the user's med/activity names — entirely on-device.\n- **Mirror push**: `SnapshotBuilder` reads through the stores and emits a versioned JSON snapshot (schema v4, snake_case, ISO dates); pushed to the web with a hashed capability token from the pairing flow.\n\n## The web side\n\nNext.js (repo root `app/`, `components/`) + Convex (`convex/`):\n- **Convex tables**: `mirrors` (one snapshot blob per user), `mirrorTokens` (SHA-256-hashed capability tokens; raw token lives only in the phone's Keychain), `pairingCodes` (short-lived, single-use codes minted by the dashboard, claimed by the phone).\n- **Dashboard** (`MirrorDashboard`): renders the snapshot sections read-only; parses newer fields optionally so old snapshots never break it. `MirrorTokensManager` lists/revokes devices.\n- **`/api/extract`**: the one cloud-AI endpoint — Claude vision parses a scanned document into vaccine/vet/med records the app then writes locally.\n\n## Cross-cutting conventions\n\n- **CloudKit rules everywhere**: every relationship optional with an inverse; enums persisted as `*Raw` strings with a safe fallback for unknown values (forward-compatible with newer app versions).\n- **Additive → migrate → narrow**: model refactors land as green steps (add new shape, move consumers kind-by-kind, delete the old) with the full test suite passing at each step; data migrations so far have been clean cutovers plus one idempotent launch backfill (`kindRaw`).\n- **Design system** (`DesignSystem/`): `Theme` (electric-violet brand), `HeroHeader`, `BrandFormSheet`, shared photo sections with camera + library, `BrandCard/BrandList`.\n- **Testing**: ~230 unit tests over in-memory Core Data; schedulers tested against a fake notification center. Known simulator quirk: the full suite exits 65 even when green (CloudKit launch crash + auto-retry) — judge runs by pass/fail counts.\n\n## Where things are decided\n\n- Specs: `docs/superpowers/specs/` (activities, full unification, multi-pet).\n- Day-by-day history: `docs/devlog/` (lore).\n- Feature inventory: `docs/features/` (lore `feature` type — the PM-facing view).\n- Business/product planning: `docs/planning/` (lore `planning` type — mostly frozen Phase-0 chapters + the roadmap)."},"001-home-dashboard":{"id":"001-home-dashboard","col":"features","title":"Home dashboard","meta":{"lore_type":"feature","title":"Home dashboard","status":"shipped","area":"ios","entry_point":"Home tab","since":"2026-06-27"},"body":"**One glance answers \"how is my pet doing and what's coming up?\"**\n\n## How it works\nHome opens on the active pet's hero (photo, name, species — name/species editable inline) above a stack of glanceable cards: **Due soon** (anything with an upcoming next-due within ~60 days — vaccines, vet visits, activities, med refills), **Recent** (the last few logged records), plus tiles for **latest weight** and **next vet visit**. The gear opens Settings (mirror pairing, extraction endpoint, document sharing).\n\n## Details\n- Due soon and Recent are read projections of the same unified Timeline stream — tapping through lands in the record's editor.\n- The hero avatar tap opens the pet menu (see Multi-pet).\n- Quick-add sheets for weight and symptoms are reachable from their tiles.\n\n## Design notes\n- Home is deliberately read-mostly: capture happens via the center camera tab and Timeline's \"+\" (a bottom capture bar was tried and removed as a third redundant entry point)."},"002-unified-timeline":{"id":"002-unified-timeline","col":"features","title":"Unified Timeline (stream + photos)","meta":{"lore_type":"feature","title":"Unified Timeline (stream + photos)","status":"shipped","area":"ios","entry_point":"Timeline tab","since":"2026-06-27"},"body":"**Every record — vaccines, vet visits, meds, markers, symptoms, activities, diary notes — in one date-sorted, filterable stream.**\n\n## How it works\nThe Timeline tab shows one reverse-chronological list of everything that happened, each row typed with an icon/tint and, where relevant, a \"NEXT\" due date. Filter chips (All · Vaccines · Vet · Meds · Health · Symptoms · Activities · Diary) narrow the stream. A **Stream | Photos** toggle swaps the list for a photo grid of every picture attached to any record. Tapping a row opens that record's editor/detail; swipe deletes (cancelling any reminder it owned). The floating \"+\" adds any record type; low-frequency ones (Vaccine, Vet visit, Health marker) sit under a \"Health record\" submenu, and \"Scan a record\" (AI extraction) lives at the top. The header's slider icon opens activity-type management.\n\n## Details\n- Deleting the newest occurrence of a repeating activity re-arms the previous one's reminder, so a type never silently loses its \"due next.\"\n- Photos mode aggregates photos from all record kinds, not just diary entries.\n\n## Design notes\n- The Timeline replaced per-type tabs (Meds/Vaccines/Vet) early on, and later absorbed the Diary tab too — one stream + filters beat parallel tabs each time.\n- The data model matches the UI: every row is one `LogEntry` occurrence with a kind, which is why the stream, filters, and \"Due soon\" need no special-casing."},"003-camera-capture":{"id":"003-camera-capture","col":"features","title":"Camera-first capture (center tab + review-and-tag)","meta":{"lore_type":"feature","title":"Camera-first capture (center tab + review-and-tag)","status":"shipped","area":"ios","entry_point":"📷 center tab","since":"2026-07-04"},"body":"**Snap a photo from anywhere in the app, then tag what it was — the photo becomes a real record, not just a picture.**\n\n## How it works\nThe center tab-bar slot is a camera button: tap → viewfinder opens instantly (photo-library picker on devices without a camera). After the shot, a **review-and-tag sheet** shows the photo with a \"What's this?\" chip strip: **Note only** (default — saves a diary entry), any **activity type** (Bath, Nail trim…), any **active medication** (logs a dose), a **health marker** (pick weight etc., type the value inline), or **Vaccine / Vet visit** — which hand off to the full editor with the photo already attached (those need more fields). Date and note are editable; Save commits.\n\n## Details\n- Tagging an activity applies its cadence and schedules the reminder — identical behavior to logging from the editor.\n- \"Take photo\" also exists inside every record editor's photo section (library + camera).\n- Symptoms are deliberately not offered from capture (episodes are time spans, not snap-moments).\n\n## Design notes\n- Camera-centric without compromising utility: the camera owns the marquee gesture; structured entry keeps its own affordances (Timeline \"+\").\n- One tap must never silently mis-file: chip choices are explicit, and Save is always the gate."},"004-ocr-tag-suggestion":{"id":"004-ocr-tag-suggestion","col":"features","title":"On-device OCR tag suggestion","meta":{"lore_type":"feature","title":"On-device OCR tag suggestion","status":"shipped","area":"ios","entry_point":"automatic, in capture review","since":"2026-07-04"},"body":"**Photograph a med bottle or preventative box and the right chip pre-selects itself — free, instant, on-device.**\n\n## How it works\nWhen the capture review sheet opens, the photo is OCR'd on-device (Apple Vision) and the recognized text is fuzzy-matched against the user's own vocabulary — their medication names and activity type names. A match pre-selects that chip with a ✨ \"suggested\" marker; the user still hits Save. No match, no camera text, or the user already tapped a chip → nothing happens.\n\n## Details\n- Matching is whole-word and case/diacritic-insensitive (\"HEARTGARD® PLUS CHEWABLES\" → med \"Heartgard\"; \"bathroom\" does NOT match \"Bath\").\n- A suggestion never overrides a manual choice and costs one tap to change.\n- Zero network calls, zero API cost, photos never leave the device for this.\n\n## Design notes\n- Chosen over a cloud vision call deliberately: packaging photos are text-rich, and on-device OCR handles them well. A paid Claude-vision fallback for text-less photos (wet dog in tub → \"Bath\") stays unbuilt until real usage shows on-device whiffing on cases that matter."},"005-activities":{"id":"005-activities","col":"features","title":"Activities (repeatable care events)","meta":{"lore_type":"feature","title":"Activities (repeatable care events)","status":"shipped","area":"ios","entry_point":"Timeline + → Activity; 📷 capture","since":"2026-06-30"},"body":"**Log anything you do for your pet repeatedly — bath, nail trim, flea treatment — and get reminded when it's due again.**\n\n## How it works\nActivity **types** are user-defined and pre-seeded so logging works with zero setup: Bath (30d), Nail trim (21d), Teeth brushing (1d), Brushing (7d), Grooming (42d), Flea & tick (30d), Deworming (90d) — each with a category (Care/Play/Feeding/Training/Health/Other), an icon, a default repeat interval, and its own reminder time of day. Logging an occurrence stamps the next due date, surfaces it in Home's \"Due soon,\" and schedules a notification (\"Time for Bella's bath\"). Types are managed from the Timeline header: rename, recategorize, change icon/cadence/reminder time, archive (history preserved). New custom types take one field (a name) and can be created inline mid-log.\n\n## Details\n- Only the newest occurrence of a type holds a pending reminder; deleting it re-arms the previous one.\n- Seeding is per-pet, idempotent, and CloudKit-safe (de-dupes by name so synced devices can't double-seed).\n- Repeat interval is copied onto each occurrence at log time, so editing a type never rewrites history.\n\n## Design notes\n- User-defined types (not a hardcoded enum) with pre-seeded editable defaults — \"super easy setup\" and full flexibility at once.\n- Category is a fixed enum, not a third entity: it only groups pickers, nobody needs to manage it."},"006-medications":{"id":"006-medications","col":"features","title":"Medications & dose logging","meta":{"lore_type":"feature","title":"Medications & dose logging","status":"shipped","area":"ios","entry_point":"Timeline + → Medication; 📷 capture (dose)","since":"2026-06-27"},"body":"**Track prescriptions — dosage, frequency, schedule, refills — and log every dose given.**\n\n## How it works\nA medication is a standing definition: drug name, dosage, frequency (daily/interval/free-text), optional schedule time, start/end dates, refill-due date, prescribing vet, photos (e.g. the label). Daily/interval schedules fire repeating dose reminders at the set time; refill dates surface in \"Due soon.\" Each dose given is logged (from the med's detail page, or one tap in camera capture) with a timestamp and optional note; the detail page shows dose history, count, and last-given.\n\n## Details\n- Ended medications stop reminding and drop out of capture's chip strip.\n- Dose logs are occurrences in the unified stream like everything else.\n\n## Design notes\n- Medication is deliberately a *definition* (like an activity type), not an occurrence — the dose is the occurrence. This split is what makes \"tap Apoquel after snapping a photo\" a one-tap dose log."},"007-vaccines":{"id":"007-vaccines","col":"features","title":"Vaccination records","meta":{"lore_type":"feature","title":"Vaccination records","status":"shipped","area":"ios","entry_point":"Timeline + → Health record → Vaccine; scan; 📷 capture","since":"2026-06-27"},"body":"**Keep every shot on file — name, lot number, who gave it — and never miss the next one.**\n\n## How it works\nA vaccination records the vaccine name, date administered, optional lot number / administered-by / attending vet, and photos of the certificate. An optional next-due date puts it in Home's \"Due soon\" and schedules a one-shot reminder for that day (\"Rabies is due for Milo\"). Vaccines arrive three ways: typed in manually, extracted automatically by scanning a vet document (AI), or from a captured photo via the Vaccine handoff.\n\n## Details\n- Deleting a vaccination cancels its pending reminder.\n- Rows render in the Timeline under the Vaccines chip with their next-due badge."},"008-vet-visits":{"id":"008-vet-visits","col":"features","title":"Vet visits & recommendations","meta":{"lore_type":"feature","title":"Vet visits & recommendations","status":"shipped","area":"ios","entry_point":"Timeline + → Health record → Vet visit; scan; 📷 capture","since":"2026-06-27"},"body":"**A record of every clinic visit — reason, diagnosis, treatment — plus the vet's follow-up recommendations and an automatic \"time to see the vet again\" nudge.**\n\n## How it works\nA visit captures date, clinic, vet, reason, diagnosis, treatment notes, photos, and an optional explicit next-visit date. The visit detail page keeps a running list of the vet's **recommendations** (free-text, dated). Independently, a **vet cadence** reminder fires when it's been N months (default 6) since the last visit — per pet, recomputed whenever visits change.\n\n## Details\n- The cadence reminder is one-per-pet and self-heals: deleting a visit re-syncs it from the new most-recent visit.\n- Visits also arrive via document scanning and the capture-photo handoff."},"009-health-markers":{"id":"009-health-markers","col":"features","title":"Health markers & weight trend","meta":{"lore_type":"feature","title":"Health markers & weight trend","status":"shipped","area":"ios","entry_point":"Timeline + → Health record → Health marker; Home weight tile; 📷 capture","since":"2026-06-27"},"body":"**Numeric health tracking — weight, appetite, energy, water, temperature — with the series over time.**\n\n## How it works\nA marker is one measurement: a type (weight/appetite/energy/water/temperature/other), a value, an optional unit, and a date. Home shows the latest weight as a tile with quick-add; the time-ordered series per type drives the trend view. Markers can be logged inline from camera capture (pick the type, key the number).\n\n## Details\n- Marker rows show as \"Weight: 12.4 kg\"-style entries in the Timeline under the Health chip.\n- No reminders — markers are measurements, not scheduled events."},"010-symptom-tracking":{"id":"010-symptom-tracking","col":"features","title":"Symptom tracking (episodes + check-ins)","meta":{"lore_type":"feature","title":"Symptom tracking (episodes + check-ins)","status":"shipped","area":"ios","entry_point":"Timeline + → Symptom","since":"2026-06-27"},"body":"**When something's wrong, open an episode and track it until it resolves — with dated check-ins you can show the vet.**\n\n## How it works\nA symptom **episode** has a category (digestive, skin, mobility, …), an optional title, a start date, and a status (Active/Resolved). While it's open, dated **check-in entries** record severity (mild/moderate/severe), notes, and suspected causes. Resolving stamps the end date. The Timeline shows episodes under the Symptoms chip with their Active/Resolved state.\n\n## Details\n- Episodes are spans, not moments — which is why they're the one record type not offered from camera capture.\n- Check-ins live on the episode's detail page."},"011-diary-and-photos":{"id":"011-diary-and-photos","col":"features","title":"Diary notes & photo library","meta":{"lore_type":"feature","title":"Diary notes & photo library","status":"shipped","area":"ios","entry_point":"Timeline + → Note; 📷 capture (Note only); Timeline Photos toggle","since":"2026-06-27"},"body":"**Free-form moments — a note, some photos, no structure required — plus one grid of every photo ever attached to anything.**\n\n## How it works\nA diary entry is just a date, an optional note, and photos. It's the default outcome of camera capture (\"Note only\") and one tap from the Timeline \"+\" menu. Entries appear in the Timeline stream under the Diary chip. The **Photos** toggle on the Timeline swaps to a grid of every photo across all record types — diary, activities, vet visits, vaccines, meds.\n\n## Details\n- The former Diary tab was merged into the Timeline (chip + Photos view mode); nothing was lost in the merge.\n- A diary entry can be \"promoted\" conceptually by capture tagging — the same photo+note tagged as an activity or dose becomes that record instead."},"012-care-team":{"id":"012-care-team","col":"features","title":"Care team (vets & contacts import)","meta":{"lore_type":"feature","title":"Care team (vets & contacts import)","status":"shipped","area":"ios","entry_point":"Care Team tab","since":"2026-06-27"},"body":"**Your pet's people — vets and clinics with contact details — attachable to any medical record.**\n\n## How it works\nThe Care Team tab lists veterinarians (name, clinic, phone, email, website, address, notes). \"Import from Contacts\" fills a vet from the system contact picker in one tap — no Contacts permission needed (the picker runs out-of-process and returns only the tapped contact). Vets are attachable to vaccinations, vet visits, and medications, and show on those records' detail pages.\n\n## Details\n- Contact import maps name/organization/phone/email/website/postal address automatically; everything stays editable."},"013-multi-pet":{"id":"013-multi-pet","col":"features","title":"Multi-pet","meta":{"lore_type":"feature","title":"Multi-pet","status":"shipped","area":"ios","entry_point":"Home avatar → Switch pet / Add pet","since":"2026-07-04"},"body":"**A household of pets in one app — switch the active pet and everything follows.**\n\n## How it works\nTapping the Home avatar opens a menu: **Switch pet…** (sheet listing all pets, checkmark on the active one), **Add pet…** (name + species), **Change photo…**. Switching makes that pet \"active\": Home, Timeline, Diary photos, capture, and the desktop mirror all show the active pet's data. A newly added or switched-to pet automatically gets the starter activity types.\n\n## Details\n- Notification copy names the pet (\"Time for Bella's bath\"; \"Rabies is due for Milo\") so reminders are unambiguous with several pets.\n- Each pet keeps its own vet-cadence reminder — they coexist rather than overwrite.\n- The active-pet choice is per-device (not synced across a user's devices) — deliberate v1 simplification.\n- No pet deletion yet (destructive cascade; deferred until asked for).\n\n## Design notes\n- The whole app already scoped every read/write through \"the current pet,\" so multi-pet = redefining \"current\" + a switcher — the data model needed zero changes."},"014-reminders":{"id":"014-reminders","col":"features","title":"Reminders & notifications","meta":{"lore_type":"feature","title":"Reminders & notifications","status":"shipped","area":"ios","entry_point":"automatic (local notifications)","since":"2026-06-27"},"body":"**The app remembers so the owner doesn't: due vaccines, vet cadence, daily meds, and repeat activities all notify.**\n\n## How it works\nFour reminder kinds, all local notifications (no server):\n- **Medication** — repeating daily/interval reminders at the med's schedule time.\n- **Vaccination** — one-shot on the next-due date.\n- **Vet cadence** — one-shot when it's been N months (default 6) since the last visit, per pet.\n- **Activity** — one-shot on the activity's next-due date, at the activity type's own reminder time (default 9:00).\n\nEverything with an upcoming date also appears in Home's \"Due soon\" — notifications and the dashboard read the same dates.\n\n## Details\n- Reminders are idempotent per record: rescheduling replaces, deleting cancels, and only the newest occurrence of a repeating activity holds one.\n- Copy includes the pet's name for multi-pet households.\n- Notification permission is requested once at first launch."},"015-ai-record-scan":{"id":"015-ai-record-scan","col":"features","title":"AI record scan (document extraction)","meta":{"lore_type":"feature","title":"AI record scan (document extraction)","status":"shipped","area":"cross","entry_point":"Timeline + → Scan a record","since":"2026-06-27"},"body":"**Photograph or upload a vet bill / vaccine certificate and the app files the records for you.**\n\n## How it works\n\"Scan a record\" (top of the Timeline \"+\" menu, ✨ icon) takes a PDF or photo, ships it to the extraction endpoint (`/api/extract`, Claude vision on the web side), and writes the parsed results back as real records — vaccinations, vet visits, medications — which the user reviews in place. The original document is retained via the document store (iCloud Drive when available).\n\n## Details\n- The endpoint + secret are configured in Settings; the menu entry hides when unconfigured.\n- This is the one AI feature that uses the network — capture tag suggestion (OCR) is fully on-device by contrast."},"016-desktop-mirror":{"id":"016-desktop-mirror","col":"features","title":"Desktop mirror dashboard (web)","meta":{"lore_type":"feature","title":"Desktop mirror dashboard (web)","status":"shipped","area":"web","entry_point":"web dashboard, paired from iOS Settings","since":"2026-06-27"},"body":"**A read-only web dashboard of the pet's full health record — for the desk, the vet's office, or a family member's laptop.**\n\n## How it works\nThe iOS app (the system of record) pushes a full snapshot of the active pet — profile, meds + doses, vaccines, vet visits + recommendations, markers, symptoms, diary, activities — to the web app whenever data changes. Pairing is a one-time flow: the signed-in dashboard shows a short code/QR; the iOS app claims it and receives a long-lived device token (stored in the Keychain). The dashboard renders the latest snapshot; tokens are listable/revocable on the web.\n\n## Details\n- Strictly one-way: the web never writes pet data.\n- Multi-pet: the dashboard shows whichever pet was most recently pushed (the active one).\n- Old snapshots stay renderable — the dashboard parses newer fields optionally.\n\n## Design notes\n- The snapshot is an opaque, versioned JSON blob to the backend (currently schema v4) — the mirror contract is owned by the iOS side, which keeps model refactors from breaking the web.\n- Auth: dashboard sign-in via Convex Auth; the iOS push authenticates with a hashed capability token, not a user session."},"00-overview":{"id":"00-overview","col":"planning","title":"Overview","meta":{"lore_type":"planning","title":"Overview","status":"frozen"},"body":"# Overview\n\n## Brand\n\n**Homepage** — at **`homepage.pet`**.\n\nThe name channels the MySpace / Xanga / GeoCities era of personal websites. Every pet gets their own homepage at a subdomain they own: `sandy.homepage.pet`, `max.homepage.pet`. The URL itself is the pitch — \"Sandy's homepage, pet.\"\n\n## The big idea\n\n**A homepage for your pet.** Pet owners forward vet bills, vaccination records, photos, and notes to their pet's dedicated email and text number. AI organizes everything into a beautiful living webpage, sends proactive reminders, and generates vet visit prep summaries on demand. Hardware-agnostic — no collar required.\n\n## One-liner\n\n> A homepage for your pet. Forward the stuff. We'll remember it for them.\n\n## Why this, why now\n\n- Pet owners increasingly treat pets like family members — willing to pay for tools that serve the pet\n- Existing pet records solutions are either ugly utilitarian apps (PetDesk, VitusVet, VetDex) or hardware-gated ecosystems (Fi, Tractive)\n- AI document parsing makes email ingestion genuinely viable\n- Nobody has built a beautiful, software-only, web-first pet page with AI-generated vet prep and emotional memory features\n- The emotional hook (memories, recap, year-in-review) is underserved in the category — everything currently feels clinical\n\n## Target user\n\nDog and cat owners who already treat their pet like family. Specifically the segment that:\n\n- Buys fancy food, toys, accessories without thinking\n- Has group chats and camera rolls full of pet photos\n- Experiences mild anxiety about forgetting vet appointments\n- Would pay for (or already pays for) pet insurance\n\nDemographics skew 28–45, urban/suburban, above-average income, tech-comfortable but not developer-tier. Slight skew toward women for the emotional-connection-to-pet-products segment.\n\n## Key design principles\n\n1. **Beautiful > feature-complete.** The Greece-trip-quality bar. Every screen should feel loved, not engineered.\n2. **Zero-friction input.** People should barely feel they're \"using\" the product. Forward an email. Send a text. Done.\n3. **Web-first and shareable.** Not an app silo. A URL you can send to the sitter, the vet, or grandma.\n4. **Hardware-agnostic.** No collar required. Works for any pet, any owner.\n5. **Emotional + practical.** Recap and memories sit alongside vet prep and reminders. Both matter.\n\n## What this is NOT\n\n- A wearable / hardware product (at least not at first — see [[10-hardware-vision]])\n- A clinical vet records system for practices (see [[11-vet-partnerships]])\n- A social network for pet owners\n- A marketplace for pet products\n- A generic \"pet app\" that does everything shallowly\n\n## Wedge and moat (short version)\n\n- **Wedge:** email ingestion as the primary input mechanism — no competitor has made this the core onboarding flow. 6-18 month head start.\n- **Moat:** distribution, not product. Shareable `<petname>.homepage.pet` URLs, SEO compounding, and accumulated memory data create the long-term defensibility.\n- **Delayed moat:** after 2-3 years of use, a pet's Homepage contains irreplaceable memory data. Leaving costs emotional history, not just a subscription.\n\nSee [[14-wedge-and-moat]] for the honest full argument.\n\n## Related\n\n- [[01-problem-and-users]]\n- [[02-primitives-and-templates]]\n- [[03-pet-product-spec]]\n- [[06-competition]]\n- [[14-wedge-and-moat]]"},"01-problem-and-users":{"id":"01-problem-and-users","col":"planning","title":"Problem and Users","meta":{"lore_type":"planning","title":"Problem and Users","status":"frozen"},"body":"# Problem and Users\n\n## The problem\n\nPet owners accumulate tons of information about their pets over the pet's lifetime — vet bills, vaccination certificates, medication schedules, photos, funny moments, behavioral notes, insurance documents, grooming receipts. Today this information is scattered across:\n\n- Gmail inbox (vet bills, insurance, appointment reminders)\n- Camera roll (photos and videos)\n- Vet clinic portals (each vet uses a different system, often inaccessible)\n- Paper folders (printed documents, receipts)\n- Group chats / iMessage threads (casual observations, photos shared with family)\n- Scraps of paper (feeding schedules taped to the fridge)\n- Memory (the half-remembered things you'd tell the vet if you could)\n\n## Concrete pain points\n\n1. **Vet visits are stressful and under-prepared.** You know Max has been acting weird, but you forgot exactly when it started, how many times it happened, and what the vet said last time. You walk out of appointments realizing you forgot to ask three things.\n2. **Vaccine and preventative lapses are common.** Monthly preventatives (heartworm, flea/tick) get missed. Annual vaccinations lapse because nobody remembers when they were last given.\n3. **Sitters and helpers get inadequate info.** When you travel, you send a hasty text to the sitter with care instructions you forget to update. Emergency info is incomplete.\n4. **Pet memories get lost.** Years of photos sit on phones with no narrative. Nobody looks back at them. Funny moments get forgotten.\n5. **Multi-vet households are chaos.** If you see a specialist, an ER vet, and a primary care vet, the three don't talk to each other. You're the integrator, badly.\n6. **Records requests are painful.** Changing vets, pet insurance claims, boarding facilities — all require assembling records that are scattered across half a dozen places.\n\n## Target user personas\n\n### The primary user: \"Sandi's person\"\n\n- 30-something pet parent, urban or suburban\n- Treats pet like a family member\n- Already spends generously on pet stuff (good food, toys, insurance)\n- Phone is full of pet photos\n- Experiences low-grade anxiety about forgetting appointments\n- Comfortable with tech but not a power user of productivity tools\n- Willing to pay for something that makes their pet's life better\n\n### The secondary user: \"The multi-pet caretaker\"\n\n- Has 2+ pets (often a mix: 2 dogs, a cat and a dog, etc.)\n- Even higher pain around organization\n- More likely to have experienced pet health issues\n- Higher willingness to pay\n\n### The occasional user: \"The sitter / family member\"\n\n- Doesn't own the pet but temporarily responsible\n- Needs access to instructions and records when watching the pet\n- Should be able to view and add to the page without signing up\n- Sees the product through someone else's account — a potential virality vector\n\n## What users do today (the current workarounds)\n\n- Notion pages they abandon after two weeks\n- Google Docs shared with partners\n- iCloud shared albums for photos\n- Vet clinic portals (frustrating, siloed, forgotten)\n- Paper folders in a filing cabinet\n- Calendar reminders for preventatives (half the time ignored)\n- Text threads with the sitter\n- Trying to remember\n\n## Related\n\n- [[00-overview]]\n- [[03-pet-product-spec]]\n- [[06-competition]]"},"05-pricing":{"id":"05-pricing","col":"planning","title":"Pricing","meta":{"lore_type":"planning","title":"Pricing","status":"frozen"},"body":"# Pricing\n\n## Strategy summary\n\n- **Free tier** is now mandatory, not optional, because of competitive pressure from free alternatives\n- **Annual subscription** is the hero paid tier (less churny than monthly for this category)\n- **Lifetime deal** at launch for validation + buzz, capped at first 500 users\n- **Monthly** exists only as a try-it-out on-ramp, de-emphasized in the pricing page\n\n## Why not monthly as the primary tier\n\nPet care usage is spiky, not continuous:\n\n- Spikes around vet visits, travel, new symptoms, new pets\n- Long dormant stretches in between\n- Monthly billing during dormant periods creates a churn trigger: *\"Wait, I'm paying for something I haven't opened in 3 weeks?\"*\n\nAnnual pricing decouples from this anxiety — one decision per year, feels more like pet insurance or a wellness plan.\n\n## Why a free tier is now mandatory\n\nThe competitive research in [[06-competition]] revealed several **free** alternatives:\n\n- **PetDesk** — free for pet owners (clinics pay)\n- **VitusVet** — free for pet owners (clinics pay)\n- **VetDex** — free during beta, planning freemium (free for up to 5 pets)\n- **PetLog Pro, PetNoter** — free or very cheap\n\nWithout a free tier, the first question every prospective user asks is *\"why not use PetDesk?\"* The free tier is the acquisition mechanism that gets users into the product, and the paid tier has to justify itself through visibly better features — not storage limits.\n\n## Proposed pricing tiers\n\n### Free\n\n- 1 pet\n- Basic profile and timeline\n- Manual entry + email ingestion (capped at ~20 items/month)\n- 6-month history cap\n- Shareable public page\n\n### Pro — $30-40/year (or $4/month)\n\n- Unlimited pets\n- Unlimited email ingestion with AI parsing\n- SMS interaction and reminders (with reasonable monthly caps)\n- **AI vet visit prep summaries**\n- **Monthly recap digests and year-in-review**\n- **Memory features** (\"a year ago today\", milestone cards)\n- Full history retention\n- Priority support\n\n### Launch Lifetime — $80 one-time (first 500 users only)\n\n- Everything in Pro, forever\n- Early-adopter badge on the pet page\n- Limited to first 500 signups for validation and buzz\n- Retired after initial launch period\n\n## Pricing analysis\n\n### Why $30-40/year and not higher\n\n- Free competitors compress the ceiling\n- Fi/Tractive charge ~$12-19/month but include hardware value we don't\n- $30-40 feels like \"pet insurance adjacent\" — pet owners are comfortable with annual pet-related charges at this level\n- Annual ARPU of $30-40 still works economically (see [[08-mvp-scope]] cost analysis)\n\n### Why not higher (e.g. $60-80/year)\n\n- Hard to justify against free alternatives without strong word-of-mouth\n- Churn risk: if users don't feel the value in year 2, they don't renew\n- Price can always go up after product-market-fit; hard to come down\n\n### Why not lower (e.g. $15/year)\n\n- Cheapens perception of the product\n- Compresses unit economics beyond comfort\n- The emotional positioning (\"we remember your pet's life for you\") supports a modest premium\n\n## Unit economics at proposed pricing\n\nRough per-user monthly costs at steady state:\n\n- SMS (Twilio): $0.30–$1.00\n- Claude API: $0.05–$0.30\n- Database + hosting: negligible\n- Photo storage: negligible\n- Total marginal cost: ~$0.80–$1.50/user/month\n\nAt $35/year → ~$2.92/month revenue. Gross margin ~50-70%.\n\nNot as healthy as a pure B2B SaaS, but reasonable for consumer with the free tier dragging the blended ARPU down. Heavy users need caps to prevent margin erosion.\n\n## Pricing tests to consider\n\nOnce the product is shipped and has users:\n\n- A/B test free tier limits (20 items/month vs 50 vs unlimited)\n- A/B test annual price ($30 vs $40 vs $50)\n- Test gift subscriptions (\"give a pet life page to your friend who just adopted\")\n- Test per-pet pricing (free 1, $20/yr per additional pet) vs flat pro tier\n- Test promotional discounts for referrals\n\n## Related\n\n- [[06-competition]]\n- [[08-mvp-scope]]\n- [[09-distribution-and-launch]]"},"06-competition":{"id":"06-competition","col":"planning","title":"Competition","meta":{"lore_type":"planning","title":"Competition","status":"frozen"},"body":"# Competition\n\nResearch date: **April 2026.**\n\n## TL;DR\n\nThe space is more crowded than initially assumed. **Fi shipped a direct competitor (\"Fi Intelligence\") in 2025/2026** that does AI-powered document analysis for pet records. **Whistle was acquired by Tractive in early 2025 and shut down August 31, 2025.** Multiple free pet records apps exist (PetDesk, VitusVet, VetDex). But the gap for a beautiful, hardware-agnostic, web-first pet page with email ingestion and emotional memory features is still real.\n\n## Hardware-tied platforms\n\n### Fi (tryfi / fitracking)\n\n- **Product:** Smart GPS + health collar for dogs\n- **Pricing:** ~$150 collar + ~$12-19/mo subscription\n- **Key features:** GPS tracking, activity and sleep monitoring, scratching/licking/barking/eating/drinking behavior detection, real-time behavioral and health insights\n- **Critically relevant:** Launched **\"Fi Intelligence\"** — an AI health companion that lets you upload vet receipts, insurance, vaccine records, and training certificates. AI analyzes uploaded documents to add context to health data. Can export health reports to your vet.\n- **Gaps we can exploit:**\n  - Dog-only (no cats)\n  - Hardware-gated — you must buy the $150+ collar to get full value\n  - Ecosystem-locked inside Fi's app, not a shareable web page\n  - Document upload is manual; no email ingestion\n  - Feels engineered and data-heavy, not emotionally designed\n  - No memory / recap / year-in-review features\n- **Threat level:** **High.** They've moved into the core territory faster than I would have guessed. The moat vs. Fi is consumer love, hardware-free accessibility, email ingestion, and emotional design.\n\n### Tractive\n\n- **Product:** GPS tracker with health monitoring for dogs and cats\n- **Pricing:** ~$50 hardware + $5-12/mo subscription\n- **Key features:** GPS, activity/sleep, heart rate and respiratory rate (from rest), scratch monitoring, AI-powered weekly health summaries in plain language\n- **2026 updates:** Expanded into \"comprehensive pet health and safety platform\" positioning after absorbing Whistle's customer base\n- **Gaps:** Hardware-gated, app-siloed, utilitarian design, no email ingestion, no memories/recap\n- **Threat level:** **Medium-high.** Strong hardware + reasonable software, but same structural limits as Fi.\n\n### Whistle (defunct)\n\n- Acquired by Tractive in early 2025\n- Services permanently shut down August 31, 2025\n- Customer base absorbed into Tractive\n\n### FitBark\n\n- Smaller activity/sleep tracker\n- Has historically offered a public API — the most developer-friendly of the wearables\n- **Relevance:** Easiest integration target if we want to pull wearable data without a partnership\n\n### PetPace\n\n- Vet-focused, more clinical/enterprise\n- Higher price point, typically sold through vet channels\n- Less relevant as direct competition\n\n## Vet-distributed records apps (free to pet owners)\n\n### PetDesk\n\n- **The dominant player in \"apps vets recommend.\"**\n- Free for pet owners, vet clinics pay\n- Syncs with veterinary practice management software (PIMS)\n- Handles reminders, appointment booking, vaccine tracking\n- **Why it matters:** Already owns the \"app your vet told you to download\" channel. Extremely hard to dislodge on their strength. Must compete on consumer love, not distribution.\n\n### VitusVet\n\n- Similar positioning: vet-distributed pet records\n- Profile per pet, vaccine history, lab results, medication schedules\n- Free for owners, clinic-paid\n- **Relevance:** Similar competitive shape as PetDesk\n\n### Rapport / PetPro Connect / Allydvm / Vetter\n\n- Backend practice management / client communication tools\n- Not direct consumer competitors, but adjacent\n\n## Independent records apps (consumer-facing)\n\n### VetDex\n\n- **Status:** Currently in free beta\n- **Features:** Document storage (PDFs, photos, vet visits, lab results, x-rays), QR code sharing with vets (no login required), multi-pet management, offline access, GDPR-compliant encryption\n- **Coming soon:** Vaccination reminders\n- **What it lacks:** Email ingestion, vet visit prep summaries, photo memory/gallery features, SMS interaction\n- **Pricing plan:** Will shift to freemium — free for individual pet owners managing up to 5 animals, premium for unlimited animals + data export + priority support\n- **Threat level:** Medium. Similar core functionality but utilitarian, no emotional design, no email/SMS magic. Their QR-code-to-vet feature is genuinely good.\n\n### VetVault\n\n- Positioned as a professional Personal Health Record system with veterinary standards\n- AI-powered insights, medical-grade data security\n- Likely more premium and clinical in feel\n\n### PetLog Pro\n\n- Described as a \"centralized hub for digital pet records\"\n- Supports photo uploads with timestamps\n- Good for documentation passed to vets\n\n### PetNoter\n\n- Secure digital vault for pet medical records\n- Microchip and insurance document storage\n- Designed for instant access during emergencies\n\n### Others\n\n- Apple Health Records, Google Keep, Notion — generic tools people cobble together\n- Various small native apps\n\n## The gap (what nobody does well)\n\nAfter all this research, the real gap is:\n\n1. **Beautiful, emotionally designed web pages** (not siloed apps) — everyone else feels utilitarian or clinical\n2. **Email ingestion as the primary magic** — zero friction document onboarding\n3. **AI vet prep summaries** generated from accumulated data — Fi is the only one doing anything like this, and theirs is hardware-gated\n4. **Memories, recap, year-in-review** — nobody serves the emotional side of pet ownership\n5. **Hardware-agnostic** — no collar required, works for any pet\n6. **Shareable URLs** — send the page to your vet, sitter, or grandma without them installing an app\n7. **Works for cats too** — Fi is dog-only; Tractive has a cat version but the experience still leans dog\n\n## Competitive positioning statement\n\n> **Homepage** is the beautiful, hardware-free living page for your pet. Forward vet emails and text in updates — we'll remember everything, send you reminders, and make sure every vet visit goes well. Every pet gets their own URL at `<petname>.homepage.pet`. Works for any pet. No collar required. Shareable with anyone who cares about them.\n\n## Wedge and defensibility\n\nSee [[14-wedge-and-moat]] for the full honest argument. Quick summary:\n\n- **Wedge:** email ingestion is the specific thing nobody else in the space has made the primary input mechanism. Fi has manual document upload. Tractive has manual data entry. PetDesk doesn't even do records ingestion. This is a 6-18 month head start before a well-funded competitor could copy it.\n- **Moat:** distribution. Shareable URLs, SEO compounding, late-game vet referrals. Product moats are rare in consumer; the real defensibility comes from reaching users before anyone else does.\n- **Delayed moat:** compound memory data. Year 1 retention matters enormously because every user who stays through year 1 becomes exponentially harder to lose once their pet's memory data has compounded.\n\n## Sources (April 2026)\n\n- Fi Intelligence launch: https://www.businesswire.com/news/home/20260317091481/en/Fi-Launches-Fi-Intelligence-the-First-of-Its-Kind-AI-Health-Companion-for-Dogs\n- Fi AI Collar launch 2025: https://www.businesswire.com/news/home/20250529695114/en/Fi-Unleashes-the-Worlds-First-AI-Powered-Smart-Dog-Collar-Built-for-Real-Time-Health-and-Behavior-Detection\n- Fi website: https://fitracking.com/\n- Fi app: https://fitracking.com/theapp\n- Tractive health intelligence: https://tractive.com/blog/en/press/tractive-launches-new-cat-and-dog-trackers-and-features\n- Tractive homepage: https://tractive.com/\n- Whistle shutdown coverage: https://www.dogster.com/lifestyle/whistle-dog-tracker-reviews\n- Top pet health apps roundup: https://pickles.co/post/top-8-pet-health-apps-for-modern-pet-parents\n- Vet tech review of pet health trackers: https://guidemypet.com/pet-health-tracking-system-review\n- VetDex: https://www.vetdex.app/\n- VitusVet: https://vitusvet.com/pet-owners/\n- PetDesk: https://petdesk.com/download-app-for-pet-health\n\n## Related\n\n- [[00-overview]]\n- [[05-pricing]]\n- [[09-distribution-and-launch]]\n- [[11-vet-partnerships]]"},"10-hardware-vision":{"id":"10-hardware-vision","col":"planning","title":"Hardware Vision","meta":{"lore_type":"planning","title":"Hardware Vision","status":"frozen"},"body":"# Hardware Vision\n\n## TL;DR\n\nHardware is a compelling long-term bet but a terrible place to start. Build the software-only product first, validate the thesis, use the existing user base as distribution for eventual hardware. In the meantime, integrate with existing wearables as a middle path.\n\n## Why hardware is compelling *eventually*\n\nThe software-only product has one fundamental weakness: it relies on the user remembering to log things. Email ingestion solves half of this (vet bills and confirmations arrive in email naturally), but the daily \"how is my pet doing\" data is still manual.\n\nHardware flips that:\n\n- **Passive, continuous data** — no forwarding, no texting, no remembering\n- **Generates the signals that make AI features work** — activity trends, sleep quality, weight changes, anomaly detection\n- **Creates a real moat** — software is copyable; hardware + software + cloud is harder to copy\n- **Recurring revenue anchor** — pet owners happily pay subscriptions for hardware they already own\n- **Physical brand presence** — the collar becomes visible proof of the product\n\n## What hardware could eventually do\n\n### Tier 1: table stakes (what every competitor has)\n\n- Step / activity tracking\n- Resting vs. active hours\n- GPS location (#1 reason people buy pet wearables — lost pet recovery)\n- Environment / temperature\n\n### Tier 2: differentiators\n\n- Sleep quality and patterns\n- Scratching and itching detection (huge for allergy-prone dogs)\n- Eating pattern detection (via movement signatures near bowl)\n- Heart rate and respiratory rate trends\n- Anomaly detection on motion data\n\n### Tier 3: wild ideas\n\n- Cough detection via audio\n- Bark classification (stressed / alert / excited)\n- Proximity-based social logging (near other tagged pets)\n\n## Why NOT to do hardware first\n\nHardware is brutal in ways software founders don't fully appreciate:\n\n1. **Capital intensive** — even a lean hardware MVP is $100k+ in tooling, certification, and first production\n2. **Certification** — FCC (radio), battery safety, possibly FDA for health positioning. Weeks to months per cert.\n3. **Supply chain risk** — chip shortages, component EOL notices, quality drift\n4. **Scale is hard** — first 1000 units are fine; first 10,000 have yield issues\n5. **Returns and warranty** — 5-10% of hardware units have problems\n6. **Long iteration cycles** — software ships same day; hardware revisions take months\n7. **Battery life expectations** — customers want multi-day battery, sensors kill batteries, compromises frustrate users\n8. **Fit across breeds** — Chihuahua to Great Dane is a design problem\n9. **Chewing, water, wear** — pets are rough on hardware\n10. **Incumbents exist** — Fi and Tractive have years of head start and venture funding\n\nNone of these are showstoppers. All of them together are why most hardware startups fail in year 1.\n\n## The middle path: integrate with existing wearables\n\nRather than building hardware, integrate with what's already out there. From [[06-competition]]:\n\n### Easiest integration targets\n\n- **FitBark** — has historically had a public API, the most developer-friendly player\n- **Apple iCloud Shared Photo Streams / Google Photos** — pull pet photos via face detection, no hardware partnership needed\n- **Tractive** — worth checking current API status (may require partnership conversation)\n\n### Hard but high-value\n\n- **Fi** — ecosystem locked, would require formal BD relationship\n- **Tractive** — same\n- **Pet insurance company APIs** (Lemonade, Trupanion, Embrace, Figo) — for claims and records\n- **Online pharmacy histories** (Chewy, Petco prescription histories)\n\n### Holy grail (years out)\n\n- **Vet practice management software** — Covetrus, IDEXX, Cornerstone, AVImark — direct sync with vet clinic records. Requires years of BD work with conservative enterprise vendors.\n\n## The phased hardware roadmap\n\nIf hardware is ever in the cards, the right sequence is:\n\n1. **Year 1:** software-only product; reach ~2,000 paying users; validate the thesis\n2. **Year 1.5-2:** integrate with existing trackers (FitBark first); validate that users value the data in your beautiful UX\n3. **Year 2:** begin hardware product planning with a contract manufacturer; pre-order campaign to existing users as the distribution channel\n4. **Year 3:** ship hardware if pre-orders are strong\n\n## A lean \"almost hardware\" option\n\nIf you want physical brand presence without the hardware risk, a passive QR-code pet tag:\n\n- Cheap, durable, customizable metal or silicone tag\n- Attaches to the collar\n- QR code links to the pet's emergency page (medical info, vet contact, owner contact)\n- Zero electronics, zero certification, zero power\n- Production runs in hundreds rather than thousands\n- Sellable as a physical upsell ($10-20) for a few weeks of design work\n\nThis gives the product a tangible, giftable artifact without committing to an actual electronics product. Good \"year 1\" experiment if you want to dip a toe in hardware without the full commitment.\n\n## Related\n\n- [[06-competition]]\n- [[13-roadmap]]"},"11-vet-partnerships":{"id":"11-vet-partnerships","col":"planning","title":"Vet Partnerships","meta":{"lore_type":"planning","title":"Vet Partnerships","status":"frozen"},"body":"# Vet Partnerships\n\n## TL;DR\n\nVet practices are a real long-term distribution channel, but not a first-year priority. **PetDesk already owns the \"app your vet recommends\" shelf.** You can't win by attacking their strength (clinic workflow integration); you win by being the app pet owners actually love using on their own, then leveraging that love into vet referrals later.\n\n## The landscape (see also [[06-competition]])\n\n### Vets' existing tools\n\n- **PetDesk** — dominant player in client-facing apps. Free for pet owners, paid by clinics. Syncs with veterinary practice management software (PIMS). Handles reminders and appointment booking.\n- **VitusVet** — similar positioning.\n- **Rapport / PetPro Connect / Allydvm** — backend client communication tools.\n- **Covetrus, IDEXX, Cornerstone, AVImark** — practice management software (the core business systems).\n\n### Why vets adopt tools\n\nVet practices care about (roughly in order):\n\n1. **Reducing no-shows** for appointments — biggest pain point in practice economics\n2. **Client retention** — getting clients back for annual wellness, boosters, dentals\n3. **Pre-appointment information** — knowing what's up before the visit saves time\n4. **Compliance on post-visit care** — did they give the meds? did they come back for the recheck?\n5. **Differentiation** — premium clinics want something nice to offer that other clinics don't\n6. **Client acquisition / marketing** — weaker but not zero\n\n### What vets DO NOT want\n\n- Another piece of software to manage\n- Integration work with their PIMS\n- Liability for client data they don't control\n- Another vendor relationship to maintain\n- Training their staff on yet another tool\n\n## Partnership models (ranked by feasibility)\n\n### 1. Clinic-referral program (easiest, do first)\n\nLocal vets hand out printed cards with a unique referral code. Pet owner signs up, clinic gets a small kickback or free accounts, owner gets a free year or discount.\n\n- Zero technical lift\n- You don't touch the clinic's systems\n- You're a recommendation, not a vendor\n- Like a training school or grooming salon in the vet's referral network\n\n**Target:** independent vet clinics first, not corporate chains. Concierge vets and boutique clinics are especially good fits because they value differentiation.\n\n### 2. Co-branded \"perk\" offering (medium effort)\n\nHigh-end clinics offer Homepage as a perk. *\"We give all our new clients a free lifetime membership.\"*\n\n- Clinic pays a bulk rate (maybe $10/client, one-time)\n- Pet owner gets it free through the clinic\n- Clinic markets it as part of their service\n- You get distribution + bulk licensing revenue\n- Positioning: this is the \"Peloton for vets\" play — aspirational brand lift for the clinic\n\n### 3. Pre-visit summary integration (medium-high effort)\n\nClinics opt in to receive the auto-generated pre-visit summaries for upcoming appointments from their clients who use Homepage.\n\n- Genuinely useful clinical workflow improvement\n- Requires client opt-in for data sharing\n- Vet sees a summary before the appointment: weight trends, symptoms logged, meds, questions the owner wants to ask\n- Saves time and improves care\n- Requires a vet-facing portal (additional product surface)\n\n### 4. Specialty hospital partnerships (high-value niche)\n\nCancer centers, orthopedic specialists, cardiology clinics, dermatology.\n\n- Their clients have chronic, complex pets with extensive records and multiple providers\n- Homepage is dramatically more useful for these clients than for routine wellness\n- Smaller market but higher intensity pain and higher willingness to pay\n- Specialty clinics are also more tech-forward and willing to try new things\n\n### 5. PIMS integration (hardest, far future)\n\nSync directly with Covetrus / IDEXX / Cornerstone / AVImark. Pet records populate automatically from the vet's own system.\n\n- Holy grail because it removes all manual work\n- Requires months-to-years of BD work with PIMS vendors\n- PIMS vendors are notoriously slow and conservative\n- Requires real company scale before they'll take a meeting\n- This is a year 3+ play at earliest\n\n## Why NOT to lead with vets\n\n- **B2B sales cycles for vet practices are slow** — months per clinic\n- **You need product validation first** — no vet will stake their reputation on an unproven tool\n- **PetDesk already owns the shelf** — you can't dislodge them on their strength\n- **Clinical decision-makers are scattered** — vet, office manager, tech lead, practice owner\n- **The PMF signal doesn't come from vets** — it comes from pet owners loving the product\n\n## When to start approaching vets\n\n- **Year 1 (months 1-12):** consumer-only; reach 1,000-2,000 paying users; no vet work\n- **Year 1.5:** start with 3-5 local clinics for referral program pilot; learn the sales motion\n- **Year 2:** expand referral program; pursue specialty hospital partnerships\n- **Year 2.5-3:** formalize co-branded offering; explore PIMS conversations\n\n## Meta-point\n\nVet partnerships are a multiplier on an already-working product. They don't create product-market-fit; they amplify it. If the consumer product isn't loved on its own, partnerships won't save it. If it is loved, vets will start recommending it organically and partnerships formalize what's already happening.\n\n## Related\n\n- [[06-competition]]\n- [[09-distribution-and-launch]]\n- [[13-roadmap]]"},"12-risks-and-open-questions":{"id":"12-risks-and-open-questions","col":"planning","title":"Risks and Open Questions","meta":{"lore_type":"planning","title":"Risks and Open Questions","status":"frozen"},"body":"# Risks and Open Questions\n\nAn honest inventory of what could kill this product, and the things we don't know yet. Review periodically. Update as things resolve.\n\n## Risks (most threatening first)\n\n### 1. Distribution risk (very high)\n\nConsumer products live or die on distribution. Everything in this plan depends on reaching pet owners who don't know they need it. This is the single biggest reason to be humble about the idea.\n\n- **Mitigation:** aggressive channel experimentation from day 1 (see [[09-distribution-and-launch]]); don't over-invest in product until distribution is showing signs of life\n- **Signal to watch:** signups per day, virality coefficient (shares per user), time to first 100 signups\n\n### 2. Fi Intelligence already exists (high, new)\n\nFi shipped \"Fi Intelligence\" in 2025 / expanded in early 2026. It does AI-powered document analysis for pet records, activity and health monitoring, and export to vets. They beat us to a chunk of the core idea.\n\n- **What still makes us differentiated:** hardware-free, any pet (cats too), beautiful web-first experience, email ingestion, memory/recap, shareable URL\n- **Mitigation:** lead with beauty and the emotional hook, not the \"AI analyzes your documents\" pitch (that's now table stakes). Position against Fi as \"for people who don't want a collar.\"\n- **Signal to watch:** Fi's continued feature expansion and marketing positioning\n\n### 3. Free alternatives compress pricing (high)\n\nPetDesk, VitusVet, VetDex, and others offer free pet records management. Pricing ceiling is lower than a blue-ocean market would allow.\n\n- **Mitigation:** free tier is mandatory; paid tier must justify itself through *visibly* better features; annual pricing at $30-40 is the realistic ceiling\n- **Signal to watch:** conversion rate from free to paid; willingness to pay in user interviews\n\n### 4. Email forwarding friction (medium-high, unproven)\n\nThe entire product thesis depends on users forwarding emails. We don't know if they will.\n\n- **Mitigation:** ship early to 5 users and measure this *first*; if the behavior doesn't form, pivot to a different ingestion model (iMessage forwarding, browser extension, Gmail OAuth auto-scan, integrations)\n- **Signal to watch:** emails forwarded per user per week in the first 30 days\n- **Prior art consideration:** TripIt has had exactly this model for travel since 2006. Adoption of the \"forward your stuff\" behavior in TripIt is modest — most of their users rely on the Gmail/Outlook auto-scan integration instead. That's a real data point suggesting manual forwarding has natural friction even in mature products. The Gmail OAuth approach may be a stronger version of this wedge.\n\n### 4b. Pet records category user engagement (high — new research finding, April 2026)\n\nUnderneath the \"will users forward emails\" question is a bigger, more fundamental risk: **pet owners may not engage with records-management products at all, regardless of input mechanism.**\n\n[VetVerifi's own blog post](https://www.vetverifi.com/blog/pet-owners-arent-using-apps-to-share-with-pet-service-providers) explicitly states that in existing pet records apps, *\"the 'share my records' feature is rarely used by pet owners, and most people are not using these apps as a way to forward or share records with their groomers, boarding facilities, or daycare providers.\"*\n\nIf pet owners don't care enough to use a one-tap share button that already exists in their current apps, they may not care enough to forward emails to a new one either. This is a yellow-flag data point that the entire records-management consumer product category may have weak demand.\n\n- **Mitigation:** the Homepage bet is that existing apps are ugly and clinical, and a beautiful emotionally-designed product might unlock behaviors that utilitarian apps never can (the Notion/Linear thesis — behaviors unlocked by product quality). This is plausible but unvalidated.\n- **Validation priority:** this should be the *first* thing tested with real users. Not just \"do they forward emails\" but \"do they return to the pet's page at all after day 1, and do they share it with anyone?\"\n- **Signals to watch:**\n  - Day 1, Day 7, Day 30 active rates\n  - % of users who open the page a second time after signup\n  - % of users who share the page URL with anyone (sitter, vet, family)\n  - Unprompted qualitative feedback — do they talk about it?\n- **Kill criteria:** if after 30 days with 5 real users, the median user has opened the page < 3 times and hasn't shared it with anyone, the thesis needs a hard rethink before more building.\n\n### 5. Retention during dormant periods (medium-high)\n\nPet care usage is spiky. Users might go weeks without opening the app, then question why they're subscribed.\n\n- **Mitigation:** outbound value delivery (monthly digest emails, SMS reminders, year-in-review) that reach the user even when they don't open the app\n- **Signal to watch:** 30/60/90-day active rates; open rates on digest emails; SMS reminder click-through\n\n### 6. AI parsing edge cases (medium)\n\nVet emails are in hundreds of formats. PDFs are messy. Handwritten notes exist. Claude is good but not perfect.\n\n- **Mitigation:** budget ongoing prompt engineering; add human-correctable UI; fail gracefully with \"we couldn't parse this, help us understand what it is\"\n- **Signal to watch:** parsing accuracy rate; user edit frequency\n\n### 7. Pet longevity and lifetime engagement (medium)\n\nPets live 10-15 years. Will users stay engaged that long? Probably not continuously. Churn is inevitable during quiet periods.\n\n- **Mitigation:** annual pricing reduces monthly churn anxiety; memories and year-in-review create reasons to stay; acknowledge lifecycle naturally\n- **Signal to watch:** year-over-year renewal rates (not knowable until year 2+)\n\n### 8. Founder motivation (medium-high, personal)\n\nConsumer products require 6-18 months of distribution grind after shipping. The product work is fun; the distribution work is uncomfortable. Solo founders frequently lose interest during this period.\n\n- **Mitigation:** be honest with yourself about whether this is the product you want to live with for a year; start small and validate cheaply before committing\n- **Signal to watch:** your own enthusiasm at months 3, 6, 9\n\n### 9. Platform risk (low-medium)\n\nIf Apple or Google built \"Pet Records\" as a native feature in iOS Health or Google Home, the product could be eclipsed.\n\n- **Mitigation:** move fast enough to build brand loyalty before this happens; the specific design taste is defensible even if features are copied\n- **Signal to watch:** platform announcements, Apple WWDC, Google I/O\n\n### 10. Legal / regulatory (low but real)\n\nPet medical records aren't HIPAA (that's humans), but storing medical data still has liability implications. Data breach could be damaging.\n\n- **Mitigation:** talk to a lawyer before growing past a few thousand users; implement proper encryption at rest and in transit from day 1; clear terms of service\n- **Signal to watch:** state-by-state pet-data regulations; emerging \"animal welfare data\" laws\n\n### 11. SMS compliance (low but annoying)\n\nUS carriers require 10DLC registration for business SMS. Getting registered takes weeks and has ongoing compliance requirements. Failure means deliverability collapses.\n\n- **Mitigation:** start the 10DLC process early; use Twilio which handles most of the compliance\n- **Signal to watch:** deliverability rates; carrier filtering changes\n\n### 12. SMS cost scaling (low)\n\nHeavy users could eat margin through high SMS usage.\n\n- **Mitigation:** hard caps on paid tier (e.g., 200 SMS/month); clear messaging about what's included\n- **Signal to watch:** SMS cost per paying user\n\n## Open questions (not yet resolved)\n\n### Product questions\n\n- ~~What do we name this?~~ **Resolved:** brand is **Homepage** at `homepage.pet`. Pet pages live at `<petname>.homepage.pet`.\n- What's the ideal ratio of \"recap/memory\" content vs \"practical/records\" content on the pet page?\n- How do we handle multi-user collaboration on a single pet (spouses, family)?\n- Should sitters get a special restricted view?\n- How do we handle pet loss / memorial mode?\n- What's the onboarding \"aha moment\" — how do we get users to that moment in under 2 minutes?\n\n### Business questions\n\n- Is the real wedge pets, or is there a broader \"personal page for a thing you care about\" product hiding here? (See [[02-primitives-and-templates]].)\n- Should we monetize from day 1 or grow the user base first?\n- Is there a vet-first business (B2B) hiding inside this that's bigger than the consumer version?\n- Could this be bootstrapped or does it eventually need capital?\n\n### Technical questions\n\n- How long to keep raw email data? (Privacy vs debugging tradeoff)\n- How do we handle very large accounts (hundreds of records, thousands of photos)?\n- Build on Supabase or self-host the DB? (Supabase for speed, self-host for control)\n- What's the right queue / background job architecture for AI processing?\n\n### Distribution questions\n\n- Is there an influencer / micro-celebrity who'd genuinely love this and could kickstart word of mouth?\n- Which subreddit resonates first? Which posts drive actual signups?\n- Does the product go viral through the shareable URL (sitter, vet, family) or does that never really happen?\n\n## Things to validate cheaply before building more\n\n1. **Will users forward emails?** Ship to 5 people, measure for 2 weeks.\n2. **Do users care about the vet prep feature?** Show a mockup, ask directly.\n3. **Is the memory/recap emotionally meaningful?** Show a fake year-in-review, measure reaction.\n4. **Is $30-40/year acceptable?** Ask directly in user interviews; watch for price objections.\n\n## Related\n\n- [[00-overview]]\n- [[06-competition]]\n- [[08-mvp-scope]]\n- [[13-roadmap]]"},"13-roadmap":{"id":"13-roadmap","col":"planning","title":"Roadmap","meta":{"lore_type":"planning","title":"Roadmap","status":"current"},"body":"# Roadmap\n\nMulti-year phased plan. Designed to be flexible — each phase gates the next based on validation signals.\n\n## Phase 0 — Planning (current)\n\n- [x] Brainstorm and frame the opportunity\n- [x] Research the competitive landscape\n- [x] Identify primitives and templates\n- [x] Write the vision doc and specs\n- [x] Pick a real name and claim a domain — **Homepage** at `homepage.pet`\n- [ ] Set up the initial project scaffolding\n\n## Phase 1 — MVP v0 (1-2 focused weekend
