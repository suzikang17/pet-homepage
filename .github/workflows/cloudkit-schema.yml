# Manually-triggered: pushes the Core Data model into the CloudKit Development schema
# by running the CloudKitSchemaInitializer test on a macOS runner. Promotion to
# Production stays a human step in the CloudKit Console (Apple provides no API for it).
name: CloudKit Schema Push

on:
  workflow_dispatch:

jobs:
  push-dev-schema:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Push schema (initializeCloudKitSchema in test)
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available | grep -Eo "iPhone [0-9]+[^(]*" | head -1 | xargs)
          xcodebuild test \
            -scheme PetHomepage \
            -destination "platform=iOS Simulator,name=${DEST:-iPhone 16}" \
            -only-testing:PetHomepageTests/CloudKitSchemaInitializer \
            TEST_RUNNER_CK_SCHEMA_FORCE=1 \
            CODE_SIGNING_ALLOWED=NO
