# Compile + unit-test loop for branches (this repo is developed without local Xcode).
#
# COST: macOS runners bill at 10x Linux, so this workflow is kept lean:
# - only runs when iOS sources actually change (paths filter)
# - superseded runs are cancelled (concurrency)
# - DerivedData is cached, so unchanged files aren't recompiled every run
# - `main` is not tested here: nothing reaches main without a green run on its branch
name: iOS Tests

on:
  push:
    branches-ignore: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    # A hung xcodebuild would otherwise burn the full 6h default at 10x rate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        # Not cached: caching the Homebrew symlink alone leaves a dangling link on restore
        # (exit 127). The install is ~1 min; reliability beats the saving.
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests (simulator)
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available | grep -Eo "iPhone [0-9]+[^(]*" | head -1 | xargs)
          echo "Using simulator: ${DEST:-iPhone 16}"
          # Retry-on-flake: a known nondeterministic Core Data test-harness crash lands on a
          # random ViewModel test ~1 in 2-3 runs (root cause still under investigation; the
          # diagnostics step below captures it). Retry so a transient crash doesn't block a
          # clean suite. TEST_RUNNER_ vars reach the simulator process (shell CI=true doesn't),
          # and CloudKitSchemaInitializer must skip on CI.
          attempt=1; max=3
          until [ $attempt -gt $max ]; do
            echo "::group::Test attempt $attempt/$max"
            if TEST_RUNNER_CI=true xcodebuild test \
              -scheme PetHomepage \
              -destination "platform=iOS Simulator,name=${DEST:-iPhone 16}" \
              -only-testing:PetHomepageTests \
              -parallel-testing-enabled NO \
              -enableCodeCoverage NO \
              CODE_SIGNING_ALLOWED=NO; then
              echo "::endgroup::"; echo "passed on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed"
            attempt=$((attempt+1))
          done
          echo "all $max attempts failed"; exit 1

      - name: Dump crash diagnostics on failure
        if: failure()
        run: |
          echo "=== simulator crash reports (the nil-insert stack) ==="
          for d in ~/Library/Logs/DiagnosticReports \
                   ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports; do
            for f in "$d"/PetHomepage*.ips "$d"/xctest*.ips "$d"/*.crash; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              cat "$f" | head -120
            done
          done
