# Runs the unit-test bundle on every branch push and PR. main pushes are covered
# by the TestFlight archive; this workflow is the compile+test loop for branches
# (this repo is developed without local Xcode).
name: iOS Tests

on:
  push:
    branches-ignore: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    paths:
      - "ios/**"

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests (simulator)
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available | grep -Eo "iPhone [0-9]+[^(]*" | head -1 | xargs)
          echo "Using simulator: ${DEST:-iPhone 16}"
          # TEST_RUNNER_ vars reach the simulator test process (prefix stripped): the shell's
          # CI=true does NOT propagate there, and CloudKitSchemaInitializer must skip on CI
          # (unsigned test host has no iCloud entitlement — CloudKit crashes the process).
          TEST_RUNNER_CI=true xcodebuild test \
            -scheme PetHomepage \
            -destination "platform=iOS Simulator,name=${DEST:-iPhone 16}" \
            -only-testing:PetHomepageTests \
            CODE_SIGNING_ALLOWED=NO
